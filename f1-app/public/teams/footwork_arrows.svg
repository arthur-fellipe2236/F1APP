<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Footwork Racing Scarlet Red Gradient -->
    <linearGradient id="footworkRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2430" />
      <stop offset="50%" stop-color="#D90014" />
      <stop offset="100%" stop-color="#A3000E" />
    </linearGradient>

    <!-- Arrows Historic Orange Gradient -->
    <linearGradient id="arrowsOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <filter id="footworkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Footwork Official Triple Chevron Emblem on Left -->
  <g transform="translate(10, 8)" filter="url(#footworkShadow)">
    <!-- Base Plate Shield -->
    <rect x="0" y="0" width="76" height="76" rx="16" fill="#0E1217" stroke="#252D38" stroke-width="1.5" />
    
    <!-- 3 Staggered Footwork Red Chevrons / Triangles -->
    <!-- Large Main Chevron -->
    <polygon points="12,64 56,12 44,64" fill="url(#footworkRed)" />
    <!-- Secondary Chevron (Top Right) -->
    <polygon points="56,12 70,28 54,28" fill="url(#footworkRed)" />
    <!-- Tertiary Chevron (Middle) -->
    <polygon points="46,38 62,54 48,54" fill="url(#footworkRed)" />
    
    <!-- White Contrast Accent Lines -->
    <line x1="12" y1="64" x2="56" y2="12" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Typography: FOOTWORK ARROWS on Right -->
  <g transform="translate(98, 2)" filter="url(#footworkShadow)">
    <!-- FOOTWORK in Bold High-Contrast White -->
    <text x="0" y="36" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" letter-spacing="1">FOOTWORK</text>

    <!-- ARROWS in Luminous Competition Orange -->
    <text x="0" y="60" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="20" font-weight="900" font-style="italic" fill="url(#arrowsOrange)" letter-spacing="2">ARROWS</text>

    <!-- GRAND PRIX INTERNATIONAL in Tracked Grotesque -->
    <text x="96" y="60" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="800" font-style="italic" fill="#CAD5E0" letter-spacing="3">F1 TEAM</text>

    <!-- Speed Accent Fin -->
    <path d="M 0 69 L 175 69 L 168 72 L 0 72 Z" fill="url(#footworkRed)" />
    <path d="M 178 69 L 210 69 L 206 72 L 174 72 Z" fill="url(#arrowsOrange)" />
  </g>
</svg>

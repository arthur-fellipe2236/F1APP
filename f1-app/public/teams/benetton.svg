<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="msBlueBig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4F5" />
      <stop offset="50%" stop-color="#008BE3" />
      <stop offset="100%" stop-color="#0066C4" />
    </linearGradient>
    <linearGradient id="benGreenBig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B347" />
      <stop offset="100%" stop-color="#008736" />
    </linearGradient>
    <filter id="msDropBig" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Mild Seven Box Ampliado de Borda a Borda -->
  <g transform="translate(6, 9)" filter="url(#msDropBig)">
    <rect x="0" y="0" width="66" height="66" rx="14" fill="url(#msBlueBig)" stroke="#FFFFFF" stroke-width="1.8" />
    <!-- Arco de velocidade ampliado -->
    <path d="M 8 50 C 24 24 46 17 58 26 C 45 24 27 33 15 55 Z" fill="#FFFFFF" />
    <circle cx="49" cy="22" r="3.5" fill="#FFFFFF" />
    <text x="33" y="58" font-family="'Titillium Web', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MILD SEVEN</text>
  </g>

  <!-- Right: BENETTON FORMULA 1 Ampliado -->
  <g transform="translate(78, 0)">
    <text x="0" y="42" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="24" font-weight="900" font-style="italic" fill="url(#benGreenBig)" letter-spacing="0.5">BENETTON</text>
    <text x="1" y="63" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="15.5" font-weight="900" font-style="italic" fill="url(#msBlueBig)" letter-spacing="3.2">FORMULA 1</text>
    <rect x="0" y="69" width="58" height="4" rx="2" fill="url(#benGreenBig)" />
    <rect x="62" y="69" width="28" height="4" rx="2" fill="url(#msBlueBig)" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="bmwRoundelChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#CCD5DE" />
      <stop offset="100%" stop-color="#5B6774" />
    </linearGradient>
    <linearGradient id="bmwBavarian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077D4" />
      <stop offset="100%" stop-color="#00509A" />
    </linearGradient>
    <filter id="bmwSauberDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Official BMW Roundel -->
  <g transform="translate(8, 11)" filter="url(#bmwSauberDrop)">
    <!-- Outer Chrome Ring -->
    <circle cx="31.5" cy="31.5" r="29.5" fill="#0C1014" stroke="url(#bmwRoundelChrome)" stroke-width="2.8" />
    
    <!-- B M W Letters -->
    <text x="17.5" y="20.5" font-family="'Titillium Web', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>
    <text x="31.5" y="15" font-family="'Titillium Web', system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">M</text>
    <text x="45.5" y="20.5" font-family="'Titillium Web', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">W</text>

    <!-- Inner Divided Roundel -->
    <circle cx="31.5" cy="31.5" r="19" fill="none" stroke="url(#bmwRoundelChrome)" stroke-width="1.4" />
    <!-- Top-Left Blue -->
    <path d="M 31.5 31.5 L 31.5 12.5 A 19 19 0 0 0 12.5 31.5 Z" fill="url(#bmwBavarian)" />
    <!-- Top-Right White -->
    <path d="M 31.5 31.5 L 50.5 31.5 A 19 19 0 0 0 31.5 12.5 Z" fill="#FFFFFF" />
    <!-- Bottom-Right Blue -->
    <path d="M 31.5 31.5 L 31.5 50.5 A 19 19 0 0 0 50.5 31.5 Z" fill="url(#bmwBavarian)" />
    <!-- Bottom-Left White -->
    <path d="M 31.5 31.5 L 12.5 31.5 A 19 19 0 0 0 31.5 50.5 Z" fill="#FFFFFF" />
    
    <!-- Quadrant Dividing Cross Lines -->
    <line x1="31.5" y1="12.5" x2="31.5" y2="50.5" stroke="#7A8894" stroke-width="0.7" />
    <line x1="12.5" y1="31.5" x2="50.5" y2="31.5" stroke="#7A8894" stroke-width="0.7" />
  </g>

  <!-- Right: BMW Sauber F1 Team Typography -->
  <g transform="translate(74, 0)">
    <text x="0" y="38" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="22" font-weight="900" fill="#111111" letter-spacing="0.2">BMW Sauber</text>
    <text x="1" y="58" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="900" font-style="italic" fill="#00509A" letter-spacing="3.2">F1 TEAM</text>
    <!-- BMW Motorsport Racing Livery Accent: Red & Blue Dynamic Fins -->
    <path d="M 0 66 L 76 66 L 72 70 L 0 70 Z" fill="#00509A" />
    <path d="M 74 66 L 90 66 L 86 70 L 71 70 Z" fill="#E10600" />
  </g>
</svg>
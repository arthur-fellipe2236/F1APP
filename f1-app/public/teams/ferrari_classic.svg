<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Giallo Modena Gradient -->
    <linearGradient id="ferYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF212" />
      <stop offset="60%" stop-color="#FFDE00" />
      <stop offset="100%" stop-color="#ECC600" />
    </linearGradient>

    <!-- Rosso Corsa Gradient -->
    <linearGradient id="ferRosso" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2414" />
      <stop offset="100%" stop-color="#C20000" />
    </linearGradient>

    <filter id="ferShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left Emblem: The Iconic Scudetto Ferrari Shield -->
  <g transform="translate(16, 8)" filter="url(#ferShadow)">
    <!-- Shield Outer Dark Border -->
    <path d="M 12 3 L 56 3 C 58 3 60 5 60 7 L 60 48 C 60 63 45 74 34 78 C 23 74 8 63 8 48 L 8 7 C 8 5 10 3 12 3 Z" fill="#0A0B0E" stroke="#373D4D" stroke-width="1.2" />

    <!-- Shield Canary Yellow Field -->
    <path d="M 13 4 L 55 4 C 57 4 58 5 58 7 L 58 47 C 58 61 44 72 34 76 C 24 72 10 61 10 47 L 10 7 C 10 5 11 4 13 4 Z" fill="url(#ferYellow)" />

    <!-- Italian Tricolore Top Bar -->
    <!-- Green -->
    <path d="M 10 6 L 26 6 L 26 14 L 10 14 Z" fill="#009246" />
    <!-- White -->
    <path d="M 26 6 L 42 6 L 42 14 L 26 14 Z" fill="#FFFFFF" />
    <!-- Red -->
    <path d="M 42 6 L 58 6 L 58 14 L 42 14 Z" fill="#CE2B37" />
    <!-- Thin black separator under Tricolore -->
    <line x1="10" y1="14" x2="58" y2="14" stroke="#000000" stroke-width="0.8" />

    <!-- Cavallino Rampante (Prancing Horse) Silhouette -->
    <g transform="translate(34, 40) scale(0.95)">
      <!-- Horse Head, Mane, Torso, Legs, and Tail in solid black -->
      <path d="
        M -2 -22 
        C -1 -24 3 -23 5 -20 
        C 4 -18 3 -16 6 -15 
        C 8 -13 9 -9 7 -7 
        C 5 -5 6 -2 7 1 
        C 8 3 9 7 6 12 
        C 4 16 1 19 -1 21
        L 0 24 L -3 24 L -3 21
        C -5 21 -7 18 -6 14
        C -5 10 -4 7 -6 5
        C -8 3 -11 5 -12 7
        L -14 6 C -12 2 -9 -3 -7 -5
        C -8 -7 -10 -9 -13 -8
        L -14 -10 C -10 -12 -7 -10 -5 -8
        C -6 -12 -5 -16 -3 -20 Z
      " fill="#0A0B0E" />
      <!-- Tail Sweep -->
      <path d="M -6 12 C -11 9 -14 3 -15 -4 C -16 -10 -13 -14 -11 -17 L -10 -15 C -12 -12 -13 -8 -12 -3 C -11 2 -8 7 -4 10 Z" fill="#0A0B0E" />
      <!-- Front Hooves Raised -->
      <path d="M 4 -12 C 9 -14 14 -18 17 -22 L 18 -20 C 15 -16 11 -12 6 -10 Z" fill="#0A0B0E" />
      <path d="M 3 -6 C 8 -7 13 -10 16 -14 L 17 -12 C 14 -8 9 -5 5 -4 Z" fill="#0A0B0E" />
    </g>

    <!-- Scuderia Ferrari 'S' and 'F' initials at bottom -->
    <text x="21" y="66" font-family="'Times New Roman', serif" font-size="12" font-weight="900" fill="#0A0B0E" text-anchor="middle">S</text>
    <text x="47" y="66" font-family="'Times New Roman', serif" font-size="12" font-weight="900" fill="#0A0B0E" text-anchor="middle">F</text>
  </g>

  <!-- Typography -->
  <g transform="translate(98, 20)">
    <!-- Era Badge: WORLD CHAMPIONS 1982 & 1983 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="15" rx="3" fill="#CE2B37" fill-opacity="0.2" stroke="#FF2414" stroke-width="0.8" />
      <circle cx="8" cy="7.5" r="2.5" fill="#FF2414" />
      <text x="16" y="11" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#FF6B6B" letter-spacing="1.2">CHAMPIONS 1982 · 1983</text>
    </g>

    <!-- Main Wordmark: SCUDERIA FERRARI -->
    <g transform="translate(0, 36)">
      <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="24" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="0.5">SCUDERIA FERRARI</text>
    </g>

    <!-- Subtitle: MARANELLO · FORMULA 1 -->
    <g transform="translate(1, 51)">
      <text x="0" y="0" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#CBD5E1" letter-spacing="3.2">MARANELLO · FORMULA 1</text>
    </g>

    <!-- Italian Tricolore Underline + Rosso Corsa Bar -->
    <line x1="0" y1="58" x2="225" y2="58" stroke="#252A36" stroke-width="1.5" />
    <line x1="0" y1="58" x2="70" y2="58" stroke="#CE2B37" stroke-width="2.5" />
    <line x1="72" y1="58" x2="88" y2="58" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="90" y1="58" x2="106" y2="58" stroke="#009246" stroke-width="2.5" />
  </g>
</svg>

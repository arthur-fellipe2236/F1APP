<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="turnerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081D40" />
      <stop offset="50%" stop-color="#040F24" />
      <stop offset="100%" stop-color="#020612" />
    </linearGradient>
    <filter id="turnersh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <!-- Background & Outer Border -->
  <rect width="170" height="85" rx="10" fill="url(#turnerBg)" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#1D4ED8" stroke-width="1.2" />
  
  <!-- American Roadster Tricolor Bar -->
  <rect x="12" y="2" width="46" height="3" fill="#DC2626" rx="1" />
  <rect x="62" y="2" width="46" height="3" fill="#FFFFFF" rx="1" />
  <rect x="112" y="2" width="46" height="3" fill="#2563EB" rx="1" />
  
  <!-- Left Emblem: Circular Speed Medallion with Roadster T -->
  <g transform="translate(13, 16)" filter="url(#turnersh)">
    <!-- Outer Gear/Ring -->
    <circle cx="25" cy="25" r="22" fill="#030A17" stroke="#F59E0B" stroke-width="2" />
    <circle cx="25" cy="25" r="18" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4,2" />
    <!-- Winged Speed Streaks -->
    <path d="M 12,25 L 18,22 L 18,28 Z" fill="#F59E0B" />
    <path d="M 38,25 L 32,22 L 32,28 Z" fill="#F59E0B" />
    <!-- Monogram T -->
    <text x="25" y="32" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" text-anchor="middle">T</text>
  </g>
  
  <!-- Right Typography Block -->
  <g transform="translate(67, 19)" filter="url(#turnersh)">
    <text x="0" y="22" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="21" letter-spacing="1.6">TURNER</text>
    <text x="1" y="33" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="7.5" letter-spacing="2.2">TURNER SPECIAL</text>
    <line x1="1" y1="38" x2="92" y2="38" stroke="#F59E0B" stroke-width="1.2" opacity="0.8" />
    <text x="1" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="6.3" letter-spacing="1.6">INDIANAPOLIS 500 • 1953</text>
  </g>
</svg>
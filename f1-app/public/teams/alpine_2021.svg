<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="340" height="95">
  <defs>
    <linearGradient id="alpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1E" /><stop offset="50%" stop-color="#040812" /><stop offset="100%" stop-color="#02040A" />
    </linearGradient>
    <filter id="alpshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>
  <rect width="340" height="95" rx="10" fill="url(#alpBg)" />
  <rect x="1.5" y="1.5" width="337" height="92" rx="8.5" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="16" y="2" width="308" height="3" fill="#0090FF" rx="1" />
  
  <!-- Tricolore Accent Tab (France Heritage) -->
  <g transform="translate(305, 12)">
    <rect x="0" y="0" width="5" height="12" fill="#002D72" />
    <rect x="5" y="0" width="5" height="12" fill="#FFFFFF" />
    <rect x="10" y="0" width="5" height="12" fill="#ED2939" />
  </g>

  <!-- Stylized Alpine A-Flèche Emblem -->
  <g transform="translate(24, 18)" filter="url(#alpshadow)">
    <rect width="58" height="58" rx="8" fill="#002D72" opacity="0.35" stroke="#0090FF" stroke-width="1" />
    <!-- Iconic A Arrow Glyph -->
    <path d="M 14 47 L 29 13 L 44 47 L 37 47 L 33 38 L 25 38 L 22 47 Z M 27 33 L 31 33 L 29 23 Z" fill="#FFFFFF" />
    <path d="M 10 35 L 48 35 L 44 31 L 48 35 L 44 39 Z" stroke="#0090FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="48" cy="35" r="2" fill="#ED2939" />
  </g>

  <!-- Wordmark & Typography -->
  <g transform="translate(96, 20)" filter="url(#alpshadow)">
    <text x="0" y="26" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="4.5">ALPINE</text>
    <text x="2" y="41" fill="#0090FF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" letter-spacing="2.8">FORMULA 1 TEAM</text>
    <line x1="2" y1="46" x2="220" y2="46" stroke="#0090FF" stroke-width="1.5" opacity="0.7" />
    <text x="2" y="57" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" letter-spacing="1.6">ENSTONE &#x2022; VIRY-CH&#xC2;TILLON &#x2022; 2021&#x2013;2026</text>
  </g>
</svg>
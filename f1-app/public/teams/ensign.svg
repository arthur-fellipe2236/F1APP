<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Ensign Navy Gradient -->
    <linearGradient id="ensNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B52" />
      <stop offset="60%" stop-color="#0A1830" />
      <stop offset="100%" stop-color="#050C19" />
    </linearGradient>

    <!-- Ensign Red Gradient -->
    <linearGradient id="ensRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E17" />
      <stop offset="100%" stop-color="#C70000" />
    </linearGradient>

    <filter id="ensShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left Emblem: Mo Nunn's Team Ensign 'E' Crest -->
  <g transform="translate(14, 11)" filter="url(#ensShadow)">
    <!-- Base Shield -->
    <rect x="0" y="0" width="72" height="73" rx="10" fill="#06090F" stroke="#1A2D4F" stroke-width="1.5" />
    <rect x="3" y="3" width="66" height="67" rx="8" fill="url(#ensNavy)" />

    <!-- Union Jack Heritage Cross Subtle Backdrop -->
    <path d="M 6 36 L 66 36 M 36 6 L 36 66" stroke="#FFFFFF" stroke-width="2" opacity="0.12" />
    <path d="M 6 6 L 66 66 M 66 6 L 6 66" stroke="#FFFFFF" stroke-width="1" opacity="0.08" />

    <!-- Ensign Dynamic 'E' Monogram in Stark White & Racing Red -->
    <g transform="translate(18, 16)">
      <!-- Main Vertical Pillar of 'E' (Forward-slanted) -->
      <polygon points="4,2 12,2 8,40 0,40" fill="#FFFFFF" />

      <!-- Top Arm of 'E' with Red Speed Inset -->
      <polygon points="12,2 38,2 35,11 10,11" fill="#FFFFFF" />
      <polygon points="15,4 34,4 32,9 13,9" fill="url(#ensRed)" />

      <!-- Middle Arm of 'E' -->
      <polygon points="10,16 30,16 28,24 8,24" fill="#FFFFFF" />
      <polygon points="12,18 26,18 25,22 10,22" fill="url(#ensRed)" />

      <!-- Bottom Arm of 'E' -->
      <polygon points="8,30 36,30 33,40 5,40" fill="#FFFFFF" />
      <polygon points="10,32 32,32 30,37 7,37" fill="url(#ensRed)" />
    </g>

    <!-- Speed Triangles on Right -->
    <polygon points="58,24 64,28 58,32" fill="url(#ensRed)" />
    <polygon points="58,38 64,42 58,46" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(100, 20)">
    <!-- Era Badge: MO NUNN RACING -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="15" rx="3" fill="#FF2E17" fill-opacity="0.2" stroke="#FF2E17" stroke-width="0.8" />
      <circle cx="8" cy="7.5" r="2.5" fill="#FF2E17" />
      <text x="16" y="11" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#FF6B5C" letter-spacing="1.2">MO NUNN · GREAT BRITAIN</text>
    </g>

    <!-- Main Wordmark: TEAM ENSIGN -->
    <g transform="translate(0, 36)">
      <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="28" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="1">ENSIGN</text>
      <!-- Small 'RACING' badge -->
      <g transform="translate(142, -18)">
        <rect x="0" y="0" width="62" height="18" rx="3" fill="#0A1830" stroke="#FFFFFF" stroke-width="0.8" />
        <text x="31" y="13" font-family="'Titillium Web', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">RACING</text>
      </g>
    </g>

    <!-- Subtitle: FORMULA 1 TEAM -->
    <g transform="translate(1, 51)">
      <text x="0" y="0" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#CBD5E1" letter-spacing="3.2">FORMULA 1 TEAM · 1980-1982</text>
    </g>

    <!-- Ensign Racing Accent Stripes -->
    <line x1="0" y1="58" x2="225" y2="58" stroke="#172742" stroke-width="1.5" />
    <line x1="0" y1="58" x2="65" y2="58" stroke="#FF2E17" stroke-width="2.5" />
    <line x1="68" y1="58" x2="95" y2="58" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="98" y1="58" x2="135" y2="58" stroke="#0055FF" stroke-width="2.5" />
  </g>
</svg>
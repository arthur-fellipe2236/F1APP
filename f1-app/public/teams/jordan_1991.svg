<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="jordanYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF024" />
      <stop offset="50%" stop-color="#FFD200" />
      <stop offset="100%" stop-color="#E8B000" />
    </linearGradient>
    <filter id="jordanDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Jordan Iconic Dynamic Yellow Shield / Hornet Emblem -->
  <g transform="translate(8, 11)" filter="url(#jordanDrop)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#jordanYellow)" stroke="#111111" stroke-width="2.5" />
    <!-- Stylized Aerodynamic Jordan "J" Crest -->
    <path d="M 18 16 L 42 16 L 38 24 L 28 24 L 28 38 C 28 42 25 46 20 46 C 15 46 12 43 12 39 L 20 39 C 20 40 21 41 22 41 C 23 41 24 40 24 38 L 24 24 L 14 24 Z" fill="#111111" />
    <!-- Hornet Eye / Stinger dynamic triangles -->
    <polygon points="34,28 46,28 42,34 36,34" fill="#111111" />
    <polygon points="32,37 44,37 38,45 32,45" fill="#E50000" />
  </g>

  <!-- Right: JORDAN GRAND PRIX Typography -->
  <g transform="translate(74, 0)">
    <text x="0" y="42" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="29" font-weight="900" font-style="italic" fill="#111111" letter-spacing="1">JORDAN</text>
    <text x="1" y="62" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="900" font-style="italic" fill="#111111" letter-spacing="3.5">GRAND PRIX</text>
    <!-- Jordan Yellow Accent Speed Bar -->
    <rect x="0" y="68" width="90" height="4" rx="2" fill="url(#jordanYellow)" stroke="#111" stroke-width="0.8" />
  </g>
</svg>
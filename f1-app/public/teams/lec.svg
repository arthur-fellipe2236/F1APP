<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="lecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B234C" />
      <stop offset="50%" stop-color="#061633" />
      <stop offset="100%" stop-color="#020814" />
    </linearGradient>
    <linearGradient id="lecCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
    <filter id="lecsh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="170" height="85" rx="10" fill="url(#lecBg)" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#1B3D75" stroke-width="1.2" />
  <!-- Cyan Accent Bar -->
  <rect x="12" y="2" width="146" height="3" fill="url(#lecCyan)" rx="1" />
  <!-- Snowflake / Cooling Turbine Emblem -->
  <g transform="translate(12, 16)" filter="url(#lecsh)">
    <circle cx="25" cy="25" r="23" fill="#040F24" stroke="url(#lecCyan)" stroke-width="2" />
    <!-- 6-blade Snowflake Emblem -->
    <g stroke="url(#lecCyan)" stroke-width="2.5" stroke-linecap="round">
      <line x1="25" y1="12" x2="25" y2="38" />
      <line x1="14" y1="18" x2="36" y2="32" />
      <line x1="14" y1="32" x2="36" y2="18" />
    </g>
    <circle cx="25" cy="25" r="5" fill="#FFFFFF" />
  </g>
  <!-- Typography -->
  <g transform="translate(68, 20)" filter="url(#lecsh)">
    <text x="0" y="25" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="3">LEC</text>
    <text x="1" y="36" fill="url(#lecCyan)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="7.5" letter-spacing="2.8">REFRIGERATION RACING</text>
    <line x1="1" y1="41" x2="90" y2="41" stroke="url(#lecCyan)" stroke-width="1.2" />
    <text x="1" y="51" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="6.5" letter-spacing="2">DAVID PURLEY • CRP1</text>
  </g>
</svg>
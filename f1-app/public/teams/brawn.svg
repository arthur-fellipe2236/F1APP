<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <filter id="brawnShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Plate for clean contrast in any card -->
  <rect x="2" y="2" width="166" height="81" rx="8" fill="#FFFFFF" fill-opacity="0.05" />
  
  <!-- Iconic Neon Highlighter Roundel on Left -->
  <g transform="translate(8, 10)" filter="url(#brawnShadow)">
    <!-- Neon Yellow/Lime Outer Circle -->
    <circle cx="32" cy="32" r="30" fill="#D2F800" stroke="#B8DC00" stroke-width="1.5" />
    <!-- Stylized Aerodynamic GP Cutout in Deep Carbon Black -->
    <path d="M 32 6 C 46.35 6 58 17.65 58 32 C 58 46.35 46.35 58 32 58 C 17.65 58 6 46.35 6 32 C 6 17.65 17.65 6 32 6 Z M 32 13 C 21.5 13 13 21.5 13 32 C 13 42.5 21.5 51 32 51 C 42.5 51 51 42.5 51 32 C 51 21.5 42.5 13 32 13 Z" fill="#111111" fill-rule="evenodd" />
    <!-- B/P inner race craft cutout -->
    <path d="M 23 20 L 37 20 C 42.5 20 45.5 23 45.5 28.5 C 45.5 34 41.5 37 36 37 L 27.5 37 L 27.5 44 L 23 44 Z M 27.5 24.5 L 27.5 32.5 L 35 32.5 C 38.5 32.5 40.5 31 40.5 28.5 C 40.5 26 38.5 24.5 35 24.5 Z" fill="#111111" />
  </g>

  <!-- BRAWN GP Wordmark on Right -->
  <g transform="translate(74, 0)">
    <text x="0" y="44" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="31" font-weight="900" font-style="italic" fill="#111111" letter-spacing="0.5">BRAWN</text>
    <text x="1" y="64" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="900" font-style="italic" fill="#333333" letter-spacing="3.5">GP F1 TEAM</text>
    <!-- Accent speed bar in neon lime -->
    <rect x="0" y="70" width="88" height="4" rx="2" fill="#D2F800" />
    <rect x="76" y="70" width="12" height="4" rx="2" fill="#111111" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="100%" height="100%">
  <defs>
    <!-- Racing Green Gradients -->
    <linearGradient id="catGreenDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005A2A" />
      <stop offset="60%" stop-color="#003D1B" />
      <stop offset="100%" stop-color="#00220F" />
    </linearGradient>

    <!-- Electric Lime Caterham Chevron Gradient -->
    <linearGradient id="catLimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8F000" />
      <stop offset="50%" stop-color="#A2D700" />
      <stop offset="100%" stop-color="#82B000" />
    </linearGradient>

    <!-- Chrome Silver Highlight -->
    <linearGradient id="catSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D8E2DC" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="catShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Left: Caterham Crest Shield -->
  <g transform="translate(6, 6)" filter="url(#catShadow)">
    <!-- Outer Shield Border -->
    <path d="M 0,8 C 0,3.5 3.5,0 8,0 L 52,0 C 56.5,0 60,3.5 60,8 L 60,44 C 60,60 40,70 30,73 C 20,70 0,60 0,44 Z" fill="url(#catGreenDark)" stroke="#FFFFFF" stroke-width="1.8" />
    <!-- Inner Shield Rim -->
    <path d="M 3.5,9 C 3.5,5.5 6,3 9.5,3 L 50.5,3 C 54,3 56.5,5.5 56.5,9 L 56.5,43 C 56.5,57.5 38,66.5 30,69 C 22,66.5 3.5,57.5 3.5,43 Z" fill="none" stroke="url(#catLimeGrad)" stroke-width="1.2" opacity="0.9" />

    <!-- Caterham Super 7 Chevron Arrow in Electric Lime -->
    <path d="M 30,12 L 48,44 L 36,44 L 36,58 L 24,58 L 24,44 L 12,44 Z" fill="url(#catLimeGrad)" stroke="#FFFFFF" stroke-width="0.8" />
  </g>

  <!-- Right: CATERHAM F1 TEAM Typography -->
  <g filter="url(#catShadow)">
    <!-- CATERHAM in Bold Italic -->
    <text x="74" y="38" font-family="'Titillium Web', system-ui, Arial Black, sans-serif" font-size="20.5" font-weight="900" font-style="italic" fill="url(#catSilver)" stroke="#00220F" stroke-width="0.8" paint-order="stroke fill" letter-spacing="0.5">CATERHAM</text>

    <!-- F1 TEAM in Vibrant Lime -->
    <text x="75" y="58" font-family="'Titillium Web', system-ui, sans-serif" font-size="12" font-weight="900" font-style="italic" fill="url(#catLimeGrad)" letter-spacing="3.2">F1 TEAM</text>

    <!-- Racing Aerodynamic Underline Strip -->
    <path d="M 75,66 L 164,66 L 160,69 L 75,69 Z" fill="url(#catLimeGrad)" />
    <circle cx="165" cy="67.5" r="1.5" fill="#FFFFFF" />
  </g>
</svg>

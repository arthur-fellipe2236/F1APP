<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 95" width="100%" height="100%">
  <defs>
    <!-- MTV Neon Violet Gradient -->
    <linearGradient id="mtvViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1560" />
      <stop offset="50%" stop-color="#220A38" />
      <stop offset="100%" stop-color="#120420" />
    </linearGradient>

    <!-- Hot Neon Pink for MTV & Accents -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0077" />
      <stop offset="100%" stop-color="#D9005A" />
    </linearGradient>

    <!-- Ford Classic Blue Gradient -->
    <linearGradient id="fordBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004D99" />
      <stop offset="100%" stop-color="#002244" />
    </linearGradient>

    <filter id="simtekShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- MTV Music Television 3D Logo on Left -->
  <g transform="translate(10, 10)" filter="url(#simtekShadow)">
    <rect x="0" y="0" width="75" height="75" rx="16" fill="url(#mtvViolet)" stroke="#4A1C80" stroke-width="1.5" />
    
    <!-- MTV 3D Block 'M' -->
    <path d="M 12 60 L 12 20 L 26 20 L 37.5 38 L 49 20 L 63 20 L 63 60 L 53 60 L 53 34 L 43 50 L 32 50 L 22 34 L 22 60 Z" fill="#00FFCC" />
    <path d="M 16 60 L 16 23 L 26 23 L 37.5 41 L 49 23 L 59 23 L 59 60 L 53 60 L 53 38 L 43 54 L 32 54 L 22 38 L 22 60 Z" fill="#00CC99" opacity="0.6" />

    <!-- 'TV' Graffiti Spray Layer in Neon Pink -->
    <path d="M 36 28 L 56 22 L 52 30 L 46 32 L 42 56 L 36 56 L 40 33 L 34 34 Z" fill="url(#neonPink)" />
    <path d="M 46 32 L 53 30 L 59 48 L 65 30 L 72 30 L 63 56 L 56 56 Z" fill="url(#neonPink)" />

    <!-- 'MUSIC TELEVISION' Footer Banner -->
    <rect x="8" y="62" width="59" height="8" rx="2" fill="#000000" opacity="0.7" />
    <text x="37.5" y="68" font-family="'Helvetica Neue', Arial, sans-serif" font-size="4.8" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">MUSIC TELEVISION</text>
  </g>

  <!-- Center: Simtek Grand Prix -->
  <g transform="translate(98, 2)" filter="url(#simtekShadow)">
    <!-- Simtek in Muscular Modern Racing Italics -->
    <text x="0" y="38" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="34" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="1">Simtek</text>

    <!-- GRAND PRIX in Neon Lavender Tracked Subtitle -->
    <text x="2" y="60" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" font-style="italic" fill="#C49BFF" letter-spacing="4.5">GRAND PRIX</text>

    <!-- Neon Pink & Cyan Speed Streaks -->
    <path d="M 2 68 L 130 68 L 124 71 L 2 71 Z" fill="url(#neonPink)" />
    <path d="M 132 68 L 160 68 L 156 71 L 128 71 Z" fill="#00FFCC" />
  </g>

  <!-- Right: Official Ford Oval -->
  <g transform="translate(270, 20)" filter="url(#simtekShadow)">
    <ellipse cx="32" cy="27" rx="32" ry="18" fill="url(#fordBlue)" stroke="#FFFFFF" stroke-width="1.8" />
    <ellipse cx="32" cy="27" rx="30" ry="16" fill="none" stroke="#7BAAF7" stroke-width="0.8" opacity="0.6" />
    <!-- Classic Ford Script Typography -->
    <text x="32" y="34" font-family="'Brush Script MT', 'Lucida Calligraphy', cursive, serif" font-size="22" font-weight="bold" font-style="italic" fill="#FFFFFF" text-anchor="middle">Ford</text>
  </g>
</svg>

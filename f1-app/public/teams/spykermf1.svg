<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <!-- Vibrant Dutch Racing Orange Gradient -->
    <linearGradient id="smf1BgOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8200" />
      <stop offset="50%" stop-color="#FF6F00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- Chrome Propeller Gradient -->
    <linearGradient id="smf1Chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <filter id="smf1Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo Laranja Oficial Holandês -->
  <rect x="0" y="0" width="170" height="85" rx="10" fill="url(#smf1BgOrange)" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#FFA733" stroke-width="1.2" opacity="0.6" />

  <!-- Left: Spyker Aircraft Propeller & Wire Wheel Roundel -->
  <g transform="translate(9, 11)" filter="url(#smf1Shadow)">
    <circle cx="31.5" cy="31.5" r="30" fill="#12161A" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="31.5" cy="31.5" r="23.5" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="2.5,2.5" />
    <ellipse cx="31.5" cy="31.5" rx="25" ry="6.5" transform="rotate(-35, 31.5, 31.5)" fill="url(#smf1Chrome)" stroke="#0F172A" stroke-width="0.6" />
    <circle cx="31.5" cy="31.5" r="5.5" fill="#FF7A00" stroke="#FFFFFF" stroke-width="1.8" />
  </g>

  <!-- Right: Letras em Branco Puro -->
  <g transform="translate(76, 0)" filter="url(#smf1Shadow)">
    <!-- Spyker signature script in pure white -->
    <text x="0" y="39" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" font-size="33" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">Spyker</text>
    <!-- MF1 RACING in bold white racing sans -->
    <text x="2" y="60" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="16" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="2.5">MF1 RACING</text>
    <!-- White Speed Accent Line -->
    <rect x="2" y="67" width="86" height="3" rx="1.5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 85" width="100%" height="100%">
  <defs>
    <!-- Sauber Crimson Red Gradient -->
    <linearGradient id="sbRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2418" />
      <stop offset="60%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#A80000" />
    </linearGradient>

    <!-- Chrome / Graphite Silver Gradients -->
    <linearGradient id="sbChromeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="sbDarkGraphite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="sbShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Left: Sauber "S" Helical Swirl Roundel Emblem -->
  <g transform="translate(6, 6)" filter="url(#sbShadow)">
    <!-- Outer Chrome Ring -->
    <circle cx="36" cy="36" r="33" fill="none" stroke="url(#sbChromeRing)" stroke-width="3.5" />
    <circle cx="36" cy="36" r="30.5" fill="#FFFFFF" />

    <!-- Sauber Helical Red Curved Swirls forming stylized 'S' -->
    <!-- Top-Right Red Crescent Wave -->
    <path d="M 36,6 C 48,6 59,15 61,27 C 62,35 58,43 51,48 C 45,52 38,51 32,48 C 26,45 23,40 25,35 C 27,29 33,28 38,30 C 44,32 47,30 47,25 C 47,18 41,13 34,13 C 27,13 21,17 18,22 C 16,16 23,8 36,6 Z" fill="url(#sbRedGrad)" />

    <!-- Bottom-Left Red Crescent Wave -->
    <path d="M 36,66 C 24,66 13,57 11,45 C 10,37 14,29 21,24 C 27,20 34,21 40,24 C 46,27 49,32 47,37 C 45,43 39,44 34,42 C 28,40 25,42 25,47 C 25,54 31,59 38,59 C 45,59 51,55 54,50 C 56,56 49,64 36,66 Z" fill="url(#sbRedGrad)" />

    <!-- Center Dynamic Dividing Accent -->
    <circle cx="36" cy="36" r="4.5" fill="url(#sbDarkGraphite)" stroke="#FFFFFF" stroke-width="1.2" />
  </g>

  <!-- Right: SAUBER F1 TEAM Typography -->
  <g filter="url(#sbShadow)">
    <!-- SAUBER in Bold Sleek Capitals -->
    <text x="80" y="38" font-family="'Titillium Web', system-ui, Arial Black, sans-serif" font-size="22" font-weight="900" fill="url(#sbDarkGraphite)" letter-spacing="1">SAUBER</text>

    <!-- F1 TEAM in Vibrant Sauber Red -->
    <text x="81" y="58" font-family="'Titillium Web', system-ui, sans-serif" font-size="12" font-weight="900" fill="url(#sbRedGrad)" letter-spacing="3.8">F1 TEAM</text>

    <!-- Aerodynamic base line -->
    <path d="M 81,66 L 168,66 L 164,68.5 L 81,68.5 Z" fill="url(#sbRedGrad)" />
    <circle cx="168" cy="67.2" r="1.5" fill="url(#sbDarkGraphite)" />
  </g>
</svg>

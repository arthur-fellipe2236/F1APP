<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Leyton House Signature Turquoise / Miami Blue Gradient -->
    <linearGradient id="leytonTurquoise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0DF" />
      <stop offset="50%" stop-color="#00C4B4" />
      <stop offset="100%" stop-color="#009688" />
    </linearGradient>

    <!-- Deep Slate Racing Carbon Gradient -->
    <linearGradient id="leytonDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B24" />
      <stop offset="50%" stop-color="#071017" />
      <stop offset="100%" stop-color="#03080C" />
    </linearGradient>

    <!-- Luminous Neon Accent -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFEA" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <filter id="leytonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Left Emblem: The Iconic Leyton House Speed Shield & Monogram -->
  <g transform="translate(10, 9)" filter="url(#leytonShadow)">
    <!-- Base Plate Shield -->
    <rect x="0" y="0" width="77" height="77" rx="16" fill="url(#leytonDark)" stroke="#00C4B4" stroke-width="1.5" />
    
    <!-- Subtle Inner Border -->
    <rect x="4" y="4" width="69" height="69" rx="12" fill="none" stroke="#00F0DF" stroke-width="0.75" stroke-opacity="0.3" />

    <!-- Center Aerodynamic 'LH' Speed Ring -->
    <g transform="translate(38.5, 38.5)">
      <!-- Outer Turquoise Racing Circle -->
      <circle cx="0" cy="0" r="24" fill="none" stroke="url(#leytonTurquoise)" stroke-width="2.5" />
      
      <!-- Forward Velocity Speed Arcs -->
      <path d="M-18 -12 A 22 22 0 0 1 18 -12" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <path d="M-18 12 A 22 22 0 0 0 18 12" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

      <!-- Stylized 'LH' Velocity Monogram -->
      <!-- 'L' Shape -->
      <path d="M-10,-12 L-10,10 L0,10" fill="none" stroke="url(#leytonTurquoise)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- 'H' Shape -->
      <path d="M2,-12 L2,10 M12,-12 L12,10 M2,-1 L12,-1" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

      <!-- Center Dynamic Accent Streak -->
      <polygon points="-4,-14 6,-14 2,-18 -8,-18" fill="#00FFEA" />
    </g>
  </g>

  <!-- Right Typography: LEYTON HOUSE RACING TEAM -->
  <g transform="translate(98, 14)">
    <!-- Top Speed Divider Accent -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="75" height="3" rx="1.5" fill="url(#neonGlow)" />
      <rect x="80" y="0" width="30" height="3" rx="1.5" fill="#FFFFFF" opacity="0.7" />
      <rect x="115" y="0" width="12" height="3" rx="1.5" fill="#00C4B4" opacity="0.5" />
    </g>

    <!-- Main Wordmark: LEYTON HOUSE -->
    <text x="0" y="27" font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" font-size="22.5" fill="#FFFFFF" letter-spacing="2">
      LEYTON HOUSE
    </text>

    <!-- Sub-Wordmark: RACING TEAM -->
    <text x="0" y="47" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="800" font-size="13" fill="url(#leytonTurquoise)" letter-spacing="4">
      RACING TEAM
    </text>

    <!-- Subtitle: FORMULA ONE -->
    <g transform="translate(0, 61)">
      <rect x="0" y="-8" width="3" height="9" rx="1" fill="#00C4B4" />
      <text x="8" y="0" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
            font-weight="700" font-size="9" fill="#90A8B8" letter-spacing="3">
        FORMULA ONE · MARCH RACING
      </text>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <linearGradient id="fer50Yellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF533" />
      <stop offset="60%" stop-color="#FFDD00" />
      <stop offset="100%" stop-color="#E5BE00" />
    </linearGradient>
    <linearGradient id="fer50Rosso" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D40000" />
      <stop offset="100%" stop-color="#9E0000" />
    </linearGradient>
    <filter id="fer50Shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Emblem: The Pure Authentic 1950s Scudetto Ferrari (No 1982/83 anachronisms) -->
  <g transform="translate(18, 8)" filter="url(#fer50Shadow)">
    <!-- Outer Shield Border -->
    <path d="M 12 3 L 56 3 C 58 3 60 5 60 7 L 60 48 C 60 63 45 74 34 78 C 23 74 8 63 8 48 L 8 7 C 8 5 10 3 12 3 Z" fill="#0A0B0E" stroke="#2D323F" stroke-width="1.2" />

    <!-- Canary Yellow (Giallo Modena) Field -->
    <path d="M 13 4 L 55 4 C 57 4 58 5 58 7 L 58 47 C 58 61 44 72 34 76 C 24 72 10 61 10 47 L 10 7 C 10 5 11 4 13 4 Z" fill="url(#fer50Yellow)" />

    <!-- Italian Tricolore Top Bar -->
    <path d="M 10 6 L 26 6 L 26 14 L 10 14 Z" fill="#009246" />
    <path d="M 26 6 L 42 6 L 42 14 L 26 14 Z" fill="#FFFFFF" />
    <path d="M 42 6 L 58 6 L 58 14 L 42 14 Z" fill="#CE2B37" />
    <line x1="10" y1="14" x2="58" y2="14" stroke="#000000" stroke-width="0.8" />

    <!-- Pure Classic Cavallino Rampante (Baracca / 1950 Ascari era) -->
    <g transform="translate(34, 40) scale(0.95)">
      <path d="
        M -2 -22 
        C -1 -24 3 -23 5 -20 
        C 4 -18 3 -16 6 -15 
        C 8 -13 9 -9 7 -7 
        C 5 -5 6 -2 7 1 
        C 8 3 9 7 6 12 
        C 4 16 1 19 -1 21
        L 0 24 L -3 24 L -3 21
        C -5 21 -7 18 -6 14
        C -5 10 -4 7 -6 5
        C -8 3 -11 5 -12 7
        L -14 6 C -12 2 -9 -3 -7 -5
        C -8 -7 -10 -9 -13 -8
        L -14 -10 C -10 -12 -7 -10 -5 -8
        C -6 -12 -5 -16 -3 -20 Z
      " fill="#0A0B0E" />
      <path d="M -6 12 C -11 9 -14 3 -15 -4 C -16 -10 -13 -14 -11 -17 L -10 -15 C -12 -12 -13 -8 -12 -3 C -11 2 -8 7 -4 10 Z" fill="#0A0B0E" />
      <path d="M 4 -12 C 9 -14 14 -18 17 -22 L 18 -20 C 15 -16 11 -12 6 -10 Z" fill="#0A0B0E" />
      <path d="M 3 -6 C 8 -7 13 -10 16 -14 L 17 -12 C 14 -8 9 -5 5 -4 Z" fill="#0A0B0E" />
    </g>

    <!-- Scuderia Ferrari 'S' and 'F' initials in classic serif -->
    <text x="21" y="66" font-family="'Times New Roman', Times, serif" font-size="12" font-weight="900" fill="#0A0B0E" text-anchor="middle">S</text>
    <text x="47" y="66" font-family="'Times New Roman', Times, serif" font-size="12" font-weight="900" fill="#0A0B0E" text-anchor="middle">F</text>
  </g>

  <!-- Typography Block: Pure 1950-1979 Maranello Heritage -->
  <g transform="translate(100, 24)">
    <!-- Era Badge: ERA PIONEIRA 1950–1979 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="15" rx="3" fill="#D40000" fill-opacity="0.2" stroke="#D40000" stroke-width="0.8" />
      <circle cx="8" cy="7.5" r="2.5" fill="#D40000" />
      <text x="16" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#FFA1A1" letter-spacing="1.2">HERITAGE · 1950–1979</text>
    </g>

    <!-- Wordmark -->
    <g transform="translate(0, 36)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="0.5">SCUDERIA FERRARI</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(1, 49)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#A1A1AA" letter-spacing="2.8">MARANELLO · FORMULA 1</text>
    </g>

    <!-- Underline: Rosso Corsa Vintage Bar -->
    <line x1="0" y1="56" x2="220" y2="56" stroke="#27272A" stroke-width="1.2" />
    <line x1="0" y1="56" x2="70" y2="56" stroke="#D40000" stroke-width="2.2" />
    <line x1="72" y1="56" x2="88" y2="56" stroke="#FFFFFF" stroke-width="2.2" />
    <line x1="90" y1="56" x2="106" y2="56" stroke="#009246" stroke-width="2.2" />
  </g>
</svg>
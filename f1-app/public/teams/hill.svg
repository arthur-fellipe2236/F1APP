<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="hillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="50%" stop-color="#12151A" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
    <linearGradient id="hillRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#B30500" />
    </linearGradient>
    <filter id="hsh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="170" height="85" rx="10" fill="url(#hillBg)" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#374151" stroke-width="1.2" />
  <!-- Embassy Red Top Accent -->
  <rect x="12" y="2" width="146" height="3" fill="url(#hillRed)" rx="1" />
  <!-- Graham Hill Helmet Shield (Dark Blue with 8 White Oars) -->
  <g transform="translate(12, 16)" filter="url(#hsh)">
    <circle cx="25" cy="25" r="23" fill="#001838" stroke="#FFFFFF" stroke-width="2" />
    <!-- 8 Vertical White Oar Blades (London Rowing Club) -->
    <g fill="#FFFFFF">
      <rect x="12" y="16" width="2" height="18" rx="0.8" />
      <rect x="15.5" y="14" width="2" height="22" rx="0.8" />
      <rect x="19" y="13" width="2" height="24" rx="0.8" />
      <rect x="22.5" y="12" width="2" height="26" rx="0.8" />
      <rect x="26" y="12" width="2" height="26" rx="0.8" />
      <rect x="29.5" y="13" width="2" height="24" rx="0.8" />
      <rect x="33" y="14" width="2" height="22" rx="0.8" />
      <rect x="36.5" y="16" width="2" height="18" rx="0.8" />
    </g>
    <!-- Laurel Wreath around Helmet -->
    <circle cx="25" cy="25" r="19" fill="none" stroke="#FFD100" stroke-width="1.2" stroke-dasharray="4 2" />
  </g>
  <!-- Typography -->
  <g transform="translate(66, 19)" filter="url(#hsh)">
    <text x="0" y="22" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="2">HILL</text>
    <text x="1" y="33" fill="url(#hillRed)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8" letter-spacing="3">EMBASSY RACING</text>
    <line x1="1" y1="38" x2="90" y2="38" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
    <text x="1" y="49" fill="#D1D5DB" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7" letter-spacing="2">GRAHAM HILL • GH1</text>
  </g>
</svg>
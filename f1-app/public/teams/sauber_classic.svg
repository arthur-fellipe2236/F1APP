<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <!-- Turquesa / Verde-Água Gradient -->
    <linearGradient id="scTurquoise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5CC" />
      <stop offset="50%" stop-color="#00C4B4" />
      <stop offset="100%" stop-color="#009688" />
    </linearGradient>

    <!-- Azul Escuro Profundo da Sauber -->
    <linearGradient id="scDarkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00284D" />
      <stop offset="100%" stop-color="#00142B" />
    </linearGradient>

    <filter id="scDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo Azul Escuro Oficial Sauber -->
  <rect x="0" y="0" width="170" height="85" rx="10" fill="url(#scDarkBlue)" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#00C4B4" stroke-width="1.2" opacity="0.7" />

  <!-- Left: Sauber Historic "S" Swirl in Turquesa e Branco -->
  <g transform="translate(8, 11)" filter="url(#scDrop)">
    <!-- Base Roundel in Dark Blue with White & Turquoise Trim -->
    <circle cx="31.5" cy="31.5" r="30" fill="#001B36" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Stylized Sauber Swirl "S" in Turquesa / Verde-água -->
    <path d="M 31.5 8 C 44.5 8 55 18.5 55 31.5 C 55 38 52.5 44 48.5 48.5 C 44.5 43.5 41.5 36.5 41.5 31.5 C 41.5 26 37 21.5 31.5 21.5 C 26 21.5 21.5 26 21.5 31.5 C 21.5 40.5 28.5 47.5 36.5 50.5 C 35 51 33.2 51.5 31.5 51.5 C 18.5 51.5 8 41 8 31.5 C 8 18.5 18.5 8 31.5 8 Z" fill="url(#scTurquoise)" />
    <!-- White Swirl Complement Forming Dynamic S Arc -->
    <path d="M 31.5 21.5 C 37 21.5 41.5 26 41.5 31.5 C 41.5 36.5 44.5 43.5 48.5 48.5 C 44.5 53 38.5 55.5 31.5 55.5 C 23.5 55.5 16 50.5 13.5 42.5 C 17.5 45.5 23.5 46.5 27.5 43.5 C 32.5 39.5 32.5 31.5 28.5 26.5 C 29.5 23 30.5 21.5 31.5 21.5 Z" fill="#FFFFFF" />
  </g>

  <!-- Right: SAUBER em Branco e PETRONAS em Turquesa -->
  <g transform="translate(74, 0)" filter="url(#scDrop)">
    <!-- SAUBER em Branco Puro -->
    <text x="0" y="42" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">SAUBER</text>
    <!-- PETRONAS em Turquesa / Verde-água -->
    <text x="1" y="62" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="900" font-style="italic" fill="url(#scTurquoise)" letter-spacing="3.2">PETRONAS</text>
    <!-- Speed Bars em Turquesa e Branco -->
    <rect x="1" y="68" width="62" height="3.5" rx="1.5" fill="url(#scTurquoise)" />
    <rect x="67" y="68" width="22" height="3.5" rx="1.5" fill="#FFFFFF" />
  </g>
</svg>
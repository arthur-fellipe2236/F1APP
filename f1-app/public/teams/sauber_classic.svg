<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="scSwirlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2438" />
      <stop offset="100%" stop-color="#C20014" />
    </linearGradient>
    <linearGradient id="scPetronas" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A396" />
      <stop offset="100%" stop-color="#00C4B4" />
    </linearGradient>
    <filter id="scDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Sauber Historic "S" Helical Swirl Roundel -->
  <g transform="translate(8, 10)" filter="url(#scDrop)">
    <!-- Dark Navy Base Shield with Silver Bezel -->
    <circle cx="32" cy="32" r="30" fill="#00223D" stroke="#D1D9E0" stroke-width="2" />
    
    <!-- Stylized Sauber Swirl Aerodynamic S Shape -->
    <path d="M 32 8 C 45.2 8 56 18.8 56 32 C 56 38.6 53.4 44.6 49.2 49 C 45 44 42 37 42 32 C 42 26.5 37.5 22 32 22 C 26.5 22 22 26.5 22 32 C 22 41 29 48 37 51 C 35.4 51.6 33.7 52 32 52 C 18.8 52 8 41.2 8 32 C 8 18.8 18.8 8 32 8 Z" fill="url(#scSwirlGrad)" />
    <path d="M 32 22 C 37.5 22 42 26.5 42 32 C 42 37 45 44 49.2 49 C 45 53.4 38.8 56 32 56 C 24 56 16.5 51 14 43 C 18 46 24 47 28 44 C 33 40 33 32 29 27 C 30 23.5 31 22 32 22 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Right: SAUBER PETRONAS Typography -->
  <g transform="translate(74, 0)">
    <text x="0" y="40" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="27" font-weight="900" fill="#00223D" letter-spacing="1">SAUBER</text>
    <text x="1" y="60" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="900" font-style="italic" fill="url(#scPetronas)" letter-spacing="3">PETRONAS</text>
    <!-- Turquoise & Red Speed Bars -->
    <rect x="1" y="66" width="62" height="3.5" rx="1.5" fill="url(#scPetronas)" />
    <rect x="66" y="66" width="22" height="3.5" rx="1.5" fill="url(#scSwirlGrad)" />
  </g>
</svg>
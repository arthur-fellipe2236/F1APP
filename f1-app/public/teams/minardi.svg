<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="minardiBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00356B" />
      <stop offset="100%" stop-color="#001838" />
    </linearGradient>
    <linearGradient id="minardiYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="100%" stop-color="#FFAE00" />
    </linearGradient>
    <filter id="minardiDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Authentic Scuderia Minardi Crest Shield -->
  <g transform="translate(8, 10)" filter="url(#minardiDrop)">
    <!-- Shield Outline -->
    <path d="M 6 6 L 56 6 L 56 36 C 56 50 31 60 31 60 C 31 60 6 50 6 36 Z" fill="url(#minardiBlueGrad)" stroke="url(#minardiYellow)" stroke-width="2.5" />
    <!-- Italian Tricolour Top Band -->
    <rect x="10" y="9" width="14" height="4" fill="#009246" />
    <rect x="24" y="9" width="14" height="4" fill="#FFFFFF" />
    <rect x="38" y="9" width="14" height="4" fill="#CE2B37" />
    <!-- Stylized Rampant Lion / Winged "M" in Gold/Yellow -->
    <path d="M 17 44 L 23 20 L 31 34 L 39 20 L 45 44 L 38 44 L 35 29 L 31 37 L 27 29 L 24 44 Z" fill="url(#minardiYellow)" />
  </g>

  <!-- Right: MINARDI F1 TEAM Typography -->
  <g transform="translate(72, 0)">
    <text x="0" y="42" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="25" font-weight="900" font-style="italic" fill="#111111" letter-spacing="1">MINARDI</text>
    <text x="1" y="62" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="900" font-style="italic" fill="#00356B" letter-spacing="3.5">F1 TEAM</text>
    <!-- Yellow & Tricolour Accent Bars -->
    <rect x="0" y="68" width="58" height="3.5" rx="1.5" fill="url(#minardiYellow)" />
    <rect x="62" y="68" width="10" height="3.5" rx="1" fill="#009246" />
    <rect x="73" y="68" width="10" height="3.5" rx="1" fill="#FFFFFF" stroke="#DDD" stroke-width="0.5" />
    <rect x="84" y="68" width="10" height="3.5" rx="1" fill="#CE2B37" />
  </g>
</svg>
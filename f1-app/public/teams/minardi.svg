<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="minardiYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="100%" stop-color="#FFAE00" />
    </linearGradient>
    <filter id="minardiDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Fundo Preto Oficial Minardi (1985 a 2005) -->
  <rect x="0" y="0" width="170" height="85" rx="10" fill="#0A0D12" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#252D38" stroke-width="1.2" />

  <!-- Left: Brasão Scuderia Minardi -->
  <g transform="translate(8, 10)" filter="url(#minardiDrop)">
    <path d="M 6 6 L 56 6 L 56 36 C 56 50 31 60 31 60 C 31 60 6 50 6 36 Z" fill="#001838" stroke="url(#minardiYellow)" stroke-width="2.5" />
    <!-- Faixa Tricolor Italiana -->
    <rect x="10" y="9" width="14" height="4" fill="#009246" />
    <rect x="24" y="9" width="14" height="4" fill="#FFFFFF" />
    <rect x="38" y="9" width="14" height="4" fill="#CE2B37" />
    <!-- Leão Rampante / "M" Alado em Ouro -->
    <path d="M 17 44 L 23 20 L 31 34 L 39 20 L 45 44 L 38 44 L 35 29 L 31 37 L 27 29 L 24 44 Z" fill="url(#minardiYellow)" />
  </g>

  <!-- Right: Letras em Branco Puro -->
  <g transform="translate(72, 0)" filter="url(#minardiDrop)">
    <!-- MINARDI em Branco Puro -->
    <text x="0" y="44" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="27" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="1">MINARDI</text>
    <!-- F1 TEAM em Branco Puro -->
    <text x="1" y="64" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="3.5">F1 TEAM</text>
    <!-- Barras de velocidade em amarelo e tricolor -->
    <rect x="0" y="70" width="54" height="3.5" rx="1.5" fill="url(#minardiYellow)" />
    <rect x="58" y="70" width="10" height="3.5" rx="1" fill="#009246" />
    <rect x="70" y="70" width="10" height="3.5" rx="1" fill="#FFFFFF" />
    <rect x="82" y="70" width="10" height="3.5" rx="1" fill="#CE2B37" />
  </g>
</svg>
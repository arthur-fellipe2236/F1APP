<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- French Racing Blue Gradient -->
    <linearGradient id="ligierBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="50%" stop-color="#004799" />
      <stop offset="100%" stop-color="#002D66" />
    </linearGradient>

    <!-- Gauloises Cyan Gradient -->
    <linearGradient id="gauloisesCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26C6DA" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <!-- Golden Laurels Gradient -->
    <linearGradient id="goldLaurel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <filter id="ligierShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ligier French Cockade & Winged Emblem on Left -->
  <g transform="translate(12, 10)" filter="url(#ligierShadow)">
    <!-- Deep Navy Shield Base -->
    <rect x="0" y="0" width="75" height="75" rx="16" fill="url(#ligierBlue)" stroke="url(#gauloisesCyan)" stroke-width="1.8" />
    
    <!-- French Tricolore Ribbon across Crest -->
    <path d="M 6 52 L 28 52 L 20 64 L 6 64 Z" fill="#0055A5" />
    <path d="M 28 52 L 48 52 L 40 64 L 20 64 Z" fill="#FFFFFF" />
    <path d="M 48 52 L 69 52 L 61 64 L 40 64 Z" fill="#EF4135" />

    <!-- Stylized Ligier Wing / Helmet Crest Motif -->
    <g transform="translate(37.5, 30)">
      <!-- Central Laurel Wreath -->
      <path d="M -16 -6 C -24 6 -16 16 0 18 C 16 16 24 6 16 -6 C 14 0 8 10 0 10 C -8 10 -14 0 -16 -6 Z" fill="url(#goldLaurel)" opacity="0.9" />
      
      <!-- Monogram 'JS' (Guy Ligier's tribute to Jo Schlesser) -->
      <!-- J -->
      <path d="M -8 -16 L -4 -16 L -4 0 C -4 4 -6 6 -10 6 C -12 6 -14 5 -15 4 L -13 1 C -12 2 -11 2 -10 2 C -8 2 -7 1 -7 -1 L -7 -16 Z" fill="#FFFFFF" />
      <!-- S -->
      <path d="M 14 -12 C 12 -15 8 -16 4 -16 C -1 -16 -4 -13 -4 -9 C -4 -5 -1 -3 3 -2 C 7 -1 10 0 10 3 C 10 5 8 7 4 7 C 0 7 -3 5 -5 2 L -7 5 C -4 8 0 10 5 10 C 10 10 14 7 14 3 C 14 -2 10 -4 6 -5 C 2 -6 0 -7 0 -9 C 0 -11 2 -13 5 -13 C 8 -13 11 -11 12 -9 Z" fill="#FFFFFF" />

      <!-- Center Star -->
      <polygon points="0,-18 2,-12 8,-12 3,-8 5,-2 0,-5 -5,-2 -3,-8 -8,-12 -2,-12" fill="url(#goldLaurel)" />
    </g>
  </g>

  <!-- Typography: LIGIER GAULOISES on Right -->
  <g transform="translate(100, 2)" filter="url(#ligierShadow)">
    <!-- LIGIER in Bold Racing Italics -->
    <text x="0" y="38" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="34" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="1">LIGIER</text>

    <!-- GAULOISES in Luminous Cyan -->
    <text x="2" y="62" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="20" font-weight="900" font-style="italic" fill="url(#gauloisesCyan)" letter-spacing="2">GAULOISES</text>

    <!-- F1 TEAM Subtitle -->
    <text x="146" y="62" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" font-style="italic" fill="#CAD9E8" letter-spacing="3.5">F1 TEAM</text>

    <!-- French Tricolore Speed Streak Underline -->
    <path d="M 2 71 L 65 71 L 60 74 L 2 74 Z" fill="#0055A5" />
    <path d="M 68 71 L 135 71 L 130 74 L 63 74 Z" fill="#FFFFFF" />
    <path d="M 138 71 L 210 71 L 205 74 L 133 74 Z" fill="#EF4135" />
  </g>
</svg>

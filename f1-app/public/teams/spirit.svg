<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Japanese Racing Red Gradient (Spirit Honda) -->
    <linearGradient id="spiritRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2438" />
      <stop offset="50%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#A80000" />
    </linearGradient>

    <!-- Deep Graphite / Carbon Gradient -->
    <linearGradient id="spiritDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B20" />
      <stop offset="50%" stop-color="#0E1014" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Speed Flame Gradient -->
    <linearGradient id="flameOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8800" />
      <stop offset="100%" stop-color="#E10600" />
    </linearGradient>

    <filter id="spiritShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Left Emblem: The Famous Spirit Dual Forward Chevrons & Sun Core -->
  <g transform="translate(10, 9)" filter="url(#spiritShadow)">
    <!-- Base Plate Shield -->
    <rect x="0" y="0" width="77" height="77" rx="16" fill="url(#spiritDark)" stroke="#E10600" stroke-width="1.5" />
    
    <!-- Outer Circular Speed Ring -->
    <circle cx="38.5" cy="38.5" r="27" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,2" />

    <!-- Dual Aerodynamic Velocity Chevrons (Signature Spirit Racing F1/F2 livery) -->
    <g transform="translate(38.5, 38.5)">
      <!-- Chevron 1 (Left - Pure White) -->
      <polygon points="-16,-17 0,0 -16,17 -8,17 8,0 -8,-17" fill="#FFFFFF" />
      
      <!-- Chevron 2 (Right - Japanese Sun Racing Red) -->
      <polygon points="-2,-17 14,0 -2,17 6,17 22,0 6,-17" fill="url(#spiritRed)" stroke="#FFFFFF" stroke-width="0.8" />

      <!-- Center Japanese Sun Circle Accent -->
      <circle cx="-16" cy="0" r="4.5" fill="url(#spiritRed)" stroke="#FFFFFF" stroke-width="1.2" />
    </g>

    <!-- Laurel Accent at Base -->
    <path d="M25 66 C32 63 36 66 38.5 69 C41 66 45 63 52 66" fill="none" stroke="#E10600" stroke-width="1.5" />
  </g>

  <!-- Right Typography: SPIRIT RACING HONDA V6 TURBO -->
  <g transform="translate(98, 13)">
    <!-- Top Speed Blade Accent in Racing Red & White -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="80" height="3" rx="1.5" fill="url(#spiritRed)" />
      <rect x="85" y="0" width="35" height="3" rx="1.5" fill="#FFFFFF" opacity="0.8" />
      <rect x="125" y="0" width="15" height="3" rx="1.5" fill="url(#flameOrange)" />
    </g>

    <!-- Main Wordmark: SPIRIT (Bold Italic Motorsport Letterforms) -->
    <text x="0" y="30" font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" font-size="29" fill="#FFFFFF" font-style="italic" letter-spacing="2">
      SPIRIT
    </text>

    <!-- Sub-Wordmark: RACING FORMULA 1 -->
    <text x="0" y="48" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="800" font-size="11.5" fill="#FFFFFF" letter-spacing="3.2">
      RACING FORMULA 1
    </text>

    <!-- Subtitle: HONDA TURBO V6 POWERED (Historic Honda F1 return) -->
    <g transform="translate(0, 62)">
      <rect x="0" y="-8.5" width="3" height="9.5" rx="1" fill="#E10600" />
      <text x="8" y="0" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
            font-weight="700" font-size="9" fill="#FF5252" letter-spacing="2">
        HONDA TURBO V6 · 1983
      </text>
    </g>
  </g>
</svg>

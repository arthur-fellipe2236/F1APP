<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="100%" height="100%">
  <defs>
    <!-- Radiant Orange Gradient -->
    <linearGradient id="orangeSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7500" />
      <stop offset="50%" stop-color="#FF5A00" />
      <stop offset="100%" stop-color="#E64500" />
    </linearGradient>

    <!-- Chrome & White Arrow Gradient -->
    <linearGradient id="whiteArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DDE4EC" />
    </linearGradient>

    <filter id="arrowsGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Orange Telecom Rounded Square on Left -->
  <g transform="translate(10, 15)" filter="url(#arrowsGlow)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#orangeSquare)" />
    <!-- Authentic lowercase 'orange' typography -->
    <text x="30" y="37" font-family="'Helvetica Neue', Helvetica, system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">orange</text>
  </g>

  <!-- Iconic Arrows 3-Chevron Arrowheads -->
  <g transform="translate(82, 17)" filter="url(#arrowsGlow)">
    <!-- Outer Orange Arrowhead -->
    <path d="M 12 6 L 30 28 L 12 50 L 22 28 Z" fill="url(#orangeSquare)" />
    <!-- Middle White Arrowhead -->
    <path d="M 0 10 L 16 28 L 0 46 L 9 28 Z" fill="url(#whiteArrow)" opacity="0.95" />
    <!-- Inner Amber Accent -->
    <path d="M 22 14 L 33 28 L 22 42 L 27 28 Z" fill="#FFA333" opacity="0.85" />
  </g>

  <!-- ARROWS Typography on Right -->
  <g transform="translate(126, 0)" filter="url(#arrowsGlow)">
    <!-- ARROWS in Bold Racing Italic with Speed Slant -->
    <text x="0" y="44" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="34" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="1.5">ARROWS</text>

    <!-- F1 TEAM in Tracked Orange Accent -->
    <text x="2" y="65" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="900" font-style="italic" fill="url(#orangeSquare)" letter-spacing="5">F1 TEAM</text>

    <!-- Speed Accent Underline -->
    <path d="M 98 57 L 175 57 L 168 61 L 98 61 Z" fill="url(#orangeSquare)" />
    <path d="M 178 57 L 188 57 L 185 61 L 175 61 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>

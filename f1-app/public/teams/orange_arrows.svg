<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 85" width="220" height="85">
  <defs>
    <linearGradient id="orangeBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7500" />
      <stop offset="100%" stop-color="#FF4D00" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Orange telecom rounded square on Left -->
  <g transform="translate(10, 14)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="url(#orangeBoxGrad)" />
    <text x="28" y="35" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">orange</text>
  </g>
  <!-- ARROWS Typography & F1 Arrowhead on Right -->
  <g transform="translate(74, 18)">
    <!-- "ARROWS" in bold competition italic -->
    <text x="0" y="34" font-family="system-ui, -apple-system, 'Arial Black', sans-serif" font-size="29" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="1.2">ARROWS</text>
    <text x="2" y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="800" font-style="italic" fill="#FF7500" letter-spacing="3.5">F1 TEAM</text>
    <!-- Dynamic F1 Aerodynamic Arrowheads -->
    <path d="M 126 14 L 140 28 L 126 42 L 131 28 Z" fill="#FF5500" />
    <path d="M 116 17 L 127 28 L 116 39 L 120 28 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>

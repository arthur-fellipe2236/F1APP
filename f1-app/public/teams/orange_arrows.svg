<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="oArrowsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7500" />
      <stop offset="100%" stop-color="#E64500" />
    </linearGradient>
    <filter id="oArrowsDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Iconic Orange Telecom Rounded Square -->
  <g transform="translate(8, 12)" filter="url(#oArrowsDrop)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#oArrowsGrad)" stroke="#CC3D00" stroke-width="1.5" />
    <text x="30" y="37" font-family="'Helvetica Neue', Helvetica, system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">orange</text>
  </g>

  <!-- Right: ARROWS Typography & Speed Arrowhead -->
  <g transform="translate(76, 0)">
    <text x="0" y="44" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="28" font-weight="900" font-style="italic" fill="#111111" letter-spacing="0.5">ARROWS</text>
    <text x="1" y="64" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="900" font-style="italic" fill="url(#oArrowsGrad)" letter-spacing="3.5">F1 TEAM</text>
    <!-- Arrowhead Fin in Vibrant Orange -->
    <path d="M 0 70 L 74 70 L 84 72 L 74 74 L 0 74 Z" fill="url(#oArrowsGrad)" />
  </g>
</svg>
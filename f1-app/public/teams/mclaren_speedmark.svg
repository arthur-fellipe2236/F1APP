<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <linearGradient id="mclSpeedmarkRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A00" />
      <stop offset="100%" stop-color="#C40000" />
    </linearGradient>
    <filter id="mclSpdShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Emblem: The Iconic 1997 Aerodynamic Speedmark Chevron -->
  <g transform="translate(18, 12)" filter="url(#mclSpdShadow)">
    <circle cx="35" cy="35" r="33" fill="#18181B" stroke="#3F3F46" stroke-width="1.5" />
    
    <!-- The Speedmark Swoop (The Partners, 1997) -->
    <path d="
      M 16 46 
      C 22 24 38 18 52 24 
      C 46 29 36 32 30 46 
      C 38 38 48 37 54 41 
      C 42 54 26 55 16 46 Z
    " fill="url(#mclSpeedmarkRed)" />
  </g>

  <!-- Typography Block: McLaren Speedmark Era (1997-2016) -->
  <g transform="translate(98, 22)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="15" rx="3" fill="#FF1A00" fill-opacity="0.2" stroke="#FF1A00" stroke-width="0.8" />
      <circle cx="8" cy="7.5" r="2.5" fill="#FF1A00" />
      <text x="16" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#FFA399" letter-spacing="1.2">SPEEDMARK ERA · 1997–2016</text>
    </g>

    <!-- Main Wordmark in Silver/White with integrated Speedmark chevron on text -->
    <g transform="translate(0, 37)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="0.5">MCLAREN</text>
      <!-- Small Speedmark accent right after text -->
      <path d="M 160 -18 C 166 -22 173 -21 176 -18 C 172 -16 168 -15 166 -10 C 169 -13 173 -13 175 -11 C 170 -6 163 -7 160 -18 Z" fill="url(#mclSpeedmarkRed)" />
    </g>

    <g transform="translate(1, 51)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#A1A1AA" letter-spacing="2.8">FORMULA 1 TEAM · WOKING</text>
    </g>

    <line x1="0" y1="58" x2="225" y2="58" stroke="#27272A" stroke-width="1.2" />
    <line x1="0" y1="58" x2="75" y2="58" stroke="url(#mclSpeedmarkRed)" stroke-width="2.5" />
    <line x1="78" y1="58" x2="94" y2="58" stroke="#FFFFFF" stroke-width="2.5" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="makiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E2E" />
      <stop offset="50%" stop-color="#0A101A" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>
    <linearGradient id="makiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2438" />
      <stop offset="100%" stop-color="#C40012" />
    </linearGradient>
    <filter id="mksh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="170" height="85" rx="10" fill="url(#makiBg)" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#2B3A52" stroke-width="1.2" />
  <!-- Japanese Hinomaru Accent -->
  <rect x="12" y="2" width="146" height="3" fill="url(#makiRed)" rx="1" />
  <!-- Maki Roundel -->
  <g transform="translate(12, 16)" filter="url(#mksh)">
    <circle cx="25" cy="25" r="23" fill="#FFFFFF" stroke="url(#makiRed)" stroke-width="2.5" />
    <circle cx="25" cy="25" r="16" fill="url(#makiRed)" />
    <!-- Maki Japanese Arrow -->
    <polygon points="25,14 31,34 25,30 19,34" fill="#FFFFFF" />
  </g>
  <!-- Typography -->
  <g transform="translate(68, 20)" filter="url(#mksh)">
    <text x="0" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2.5">MAKI</text>
    <text x="1" y="35" fill="url(#makiRed)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8" letter-spacing="3.5">ENGINEERING</text>
    <line x1="1" y1="40" x2="88" y2="40" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
    <text x="1" y="50" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7" letter-spacing="2">TOKYO • JAPAN • F101</text>
  </g>
</svg>
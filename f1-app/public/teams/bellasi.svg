<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="bellasiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F0407" />
      <stop offset="50%" stop-color="#120204" />
      <stop offset="100%" stop-color="#050001" />
    </linearGradient>
    <linearGradient id="bellasiRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A26" />
      <stop offset="100%" stop-color="#C2040F" />
    </linearGradient>
    <filter id="blsh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="170" height="85" rx="10" fill="url(#bellasiBg)" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#4A1016" stroke-width="1.2" />
  <!-- Swiss / Italian Accent -->
  <rect x="12" y="2" width="146" height="3" fill="url(#bellasiRed)" rx="1" />
  <!-- Bellasi Shield with Swiss Cross -->
  <g transform="translate(12, 16)" filter="url(#blsh)">
    <polygon points="12,6 38,6 35,38 25,44 15,38" fill="url(#bellasiRed)" stroke="#FFFFFF" stroke-width="2" />
    <!-- Swiss Cross in Pure White -->
    <rect x="23" y="16" width="4" height="16" fill="#FFFFFF" />
    <rect x="17" y="22" width="16" height="4" fill="#FFFFFF" />
  </g>
  <!-- Typography -->
  <g transform="translate(66, 20)" filter="url(#blsh)">
    <text x="0" y="23" fill="#FFFFFF" font-family="'Times New Roman', serif" font-weight="900" font-style="italic" font-size="22" letter-spacing="1.5">BELLASI</text>
    <text x="1" y="34" fill="url(#bellasiRed)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8" letter-spacing="3">COSTRUTTORE F1</text>
    <line x1="1" y1="39" x2="90" y2="39" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
    <text x="1" y="49" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7" letter-spacing="2">SILVIO MOSER • 1970-1971</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <!-- Benetton Official Racing Green Gradient Full-Bleed -->
    <linearGradient id="buBgGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008A46" />
      <stop offset="50%" stop-color="#007238" />
      <stop offset="100%" stop-color="#004D25" />
    </linearGradient>

    <filter id="buShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fundo Verde Oficial Benetton Preenchido de Borda a Borda -->
  <rect x="0" y="0" width="170" height="85" rx="10" fill="url(#buBgGreen)" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#00E676" stroke-width="1.2" opacity="0.6" />

  <!-- Left: O Lendário Nó de Lã Benetton em Branco Puro Gigante -->
  <g transform="translate(8, 10)" filter="url(#buShadow)">
    <rect x="0" y="0" width="62" height="64" rx="13" fill="#005A2B" stroke="#00E676" stroke-width="1.8" />
    <!-- Monograma do Nó de Lã Tricotado em Branco -->
    <path d="M 31 13 C 23.5 13 18 19 18 26.5 C 18 31.8 21.5 36 26 38 L 26 44.5 C 21.5 42.5 18 38 18 33 L 12.5 33 C 12.5 41 18 47.5 26 49.5 L 26 51.5 L 31 51.5 L 31 49.5 C 39 47.5 44.5 41 44.5 33 L 39 33 C 39 38 35.5 42.5 31 44.5 L 31 38 C 35.5 36 39 31.8 39 26.5 C 39 19 33.5 13 31 13 Z M 31 19.5 C 34.5 19.5 36.5 22.5 36.5 26.5 C 36.5 30.5 34.5 33.5 31 33.5 C 27.5 33.5 25.5 30.5 25.5 26.5 C 25.5 22.5 27.5 19.5 31 19.5 Z" fill="#FFFFFF" fill-rule="evenodd" />
  </g>

  <!-- Right: UNITED COLORS OF BENETTON em Branco Puro em Tamanho Gigante -->
  <g transform="translate(76, 0)" filter="url(#buShadow)">
    <!-- UNITED COLORS em Branco -->
    <text x="0" y="32" font-family="'Titillium Web', system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" letter-spacing="1">UNITED COLORS</text>
    <!-- OF BENETTON. em Branco -->
    <text x="0" y="47" font-family="'Titillium Web', system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#E2F5EA" letter-spacing="2">OF BENETTON.</text>
    <!-- FORMULA 1 em Verde Neon e Branco -->
    <text x="0" y="69" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="20" font-weight="900" font-style="italic" fill="#00FF88" letter-spacing="1">FORMULA 1</text>
    <!-- Friso de velocidade -->
    <rect x="0" y="74" width="88" height="3.5" rx="1.5" fill="#00FF88" />
  </g>
</svg>
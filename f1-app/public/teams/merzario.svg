<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="merzarioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0406" />
      <stop offset="50%" stop-color="#100203" />
      <stop offset="100%" stop-color="#050001" />
    </linearGradient>
    <linearGradient id="merzarioRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A26" />
      <stop offset="100%" stop-color="#C2040F" />
    </linearGradient>
    <filter id="msh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="170" height="85" rx="10" fill="url(#merzarioBg)" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#4A1015" stroke-width="1.2" />
  <!-- Italian Tricolore Top Bar -->
  <rect x="15" y="2" width="46" height="3" fill="#009246" rx="1" />
  <rect x="61" y="2" width="48" height="3" fill="#FFFFFF" rx="1" />
  <rect x="109" y="2" width="46" height="3" fill="#CE2B37" rx="1" />
  <!-- Dynamic Red Racing Wedge -->
  <polygon points="120,5 168,5 168,80 145,80" fill="url(#merzarioRed)" opacity="0.85" />
  <!-- Arturo Merzario Cowboy Hat Emblem -->
  <g transform="translate(14, 18)" filter="url(#msh)">
    <circle cx="24" cy="24" r="22" fill="#140204" stroke="url(#merzarioRed)" stroke-width="2" />
    <!-- Cowboy Hat Crown & Brim -->
    <path d="M 10 28 C 14 26, 34 26, 38 28 C 42 29, 36 32, 24 32 C 12 32, 6 29, 10 28 Z" fill="#FFFFFF" />
    <path d="M 16 27 C 17 17, 19 14, 24 15 C 29 14, 31 17, 32 27 Z" fill="#FFFFFF" />
    <path d="M 21 15 L 27 15 L 26 18 L 22 18 Z" fill="#C2040F" />
    <!-- Star Emblem below hat -->
    <polygon points="24,35 25.5,39 29.5,39.5 26.5,42 27.5,46 24,43.5 20.5,46 21.5,42 18.5,39.5 22.5,39" fill="#FFD100" />
  </g>
  <!-- Typography -->
  <g transform="translate(68, 22)" filter="url(#msh)">
    <text x="0" y="22" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="18.5" letter-spacing="1.5">MERZARIO</text>
    <text x="1" y="34" fill="url(#merzarioRed)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8.5" letter-spacing="3.5">TEAM F1</text>
    <line x1="1" y1="39" x2="65" y2="39" stroke="#FF1A26" stroke-width="1.2" />
    <text x="1" y="49" fill="#A89092" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="6.5" letter-spacing="2">CERMENATE • ITALIA</text>
  </g>
</svg>
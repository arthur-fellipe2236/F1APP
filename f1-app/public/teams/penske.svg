<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <filter id="penShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g transform="translate(14, 11)" filter="url(#penShadow)">
    <rect x="0" y="0" width="72" height="73" rx="10" fill="#0A0F1A" stroke="#1D2A44" stroke-width="1.5" />
    <rect x="3" y="3" width="66" height="67" rx="8" fill="#101828" />
    <!-- Penske Speed Stripe & Shield -->
    <rect x="14" y="14" width="44" height="45" rx="5" fill="#0A1830" stroke="#FFFFFF" stroke-width="1.5" />
    <polygon points="14,14 36,14 26,59 14,59" fill="#0038A8" />
    <polygon points="36,14 48,14 38,59 26,59" fill="#FFFFFF" />
    <polygon points="48,14 58,14 48,59 38,59" fill="#E10600" />
    <text x="36" y="42" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" font-style="italic" fill="#FFFFFF" text-anchor="middle" stroke="#000000" stroke-width="0.8">P</text>
  </g>
  <g transform="translate(100, 20)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="154" height="15" rx="3" fill="#0038A8" fill-opacity="0.3" stroke="#0038A8" stroke-width="0.8" />
      <circle cx="8" cy="7.5" r="2.5" fill="#0055FF" />
      <text x="16" y="11" font-family="'Titillium Web', sans-serif" font-size="8" font-weight="900" fill="#66A3FF" letter-spacing="1.2">ROGER PENSKE RACING</text>
    </g>
    <g transform="translate(0, 36)">
      <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="28" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="1">PENSKE</text>
    </g>
    <g transform="translate(1, 51)">
      <text x="0" y="0" font-family="'Titillium Web', sans-serif" font-size="10" font-weight="800" fill="#CBD5E1" letter-spacing="3.2">FORMULA 1 TEAM · 1974-1977</text>
    </g>
    <line x1="0" y1="58" x2="225" y2="58" stroke="#1D2A44" stroke-width="1.5" />
    <line x1="0" y1="58" x2="60" y2="58" stroke="#0038A8" stroke-width="2.5" />
    <line x1="63" y1="58" x2="85" y2="58" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="88" y1="58" x2="115" y2="58" stroke="#E10600" stroke-width="2.5" />
  </g>
</svg>

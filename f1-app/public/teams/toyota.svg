<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200">
  <!-- Toyota Racing Oval Crest on Left -->
  <g transform="translate(105, 100)">
    <!-- Outer ellipse -->
    <ellipse cx="0" cy="0" rx="80" ry="54" fill="none" stroke="#EB0A1E" stroke-width="11"/>
    <!-- Horizontal inner ellipse -->
    <ellipse cx="0" cy="-7" rx="36" ry="23" fill="none" stroke="#EB0A1E" stroke-width="9.5"/>
    <!-- Vertical inner ellipse (T) -->
    <ellipse cx="0" cy="10" rx="18.5" ry="37" fill="none" stroke="#EB0A1E" stroke-width="9.5"/>
  </g>

  <!-- Panasonic TOYOTA Racing Stacked on Right -->
  <!-- "Panasonic" -->
  <text x="215" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#004098" letter-spacing="1">Panasonic</text>
  
  <!-- "TOYOTA" -->
  <text x="215" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#EB0A1E" letter-spacing="1.5">TOYOTA</text>
  
  <!-- "RACING" -->
  <text x="217" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#222222" letter-spacing="5">RACING</text>
</svg>
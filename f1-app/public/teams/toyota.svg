<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="toyotaRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E34" />
      <stop offset="100%" stop-color="#C20012" />
    </linearGradient>
    <filter id="toyotaDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Official Triple-Oval Toyota Emblem -->
  <g transform="translate(8, 12)" filter="url(#toyotaDrop)">
    <!-- Outer Horizontal Ellipse -->
    <ellipse cx="32" cy="30" rx="30" ry="20" fill="none" stroke="url(#toyotaRedGrad)" stroke-width="4.8" />
    <!-- Inner Vertical Ellipse (Customer heart) -->
    <ellipse cx="32" cy="30" rx="10" ry="19" fill="none" stroke="url(#toyotaRedGrad)" stroke-width="4.2" />
    <!-- Inner Horizontal Ellipse (Forms iconic T) -->
    <ellipse cx="32" cy="23" rx="19.5" ry="9.5" fill="none" stroke="url(#toyotaRedGrad)" stroke-width="4.2" />
  </g>

  <!-- Right: TOYOTA RACING Typography -->
  <g transform="translate(76, 0)">
    <text x="0" y="44" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="25" font-weight="900" font-style="italic" fill="url(#toyotaRedGrad)" letter-spacing="1">TOYOTA</text>
    <text x="1" y="64" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="900" font-style="italic" fill="#1C1C1C" letter-spacing="3.8">RACING</text>
    <!-- Dynamic Racing Speed Swoosh in Toyota Red -->
    <path d="M 0 70 L 82 70 L 76 74 L 0 74 Z" fill="url(#toyotaRedGrad)" />
    <path d="M 78 70 L 88 70 L 84 74 L 75 74 Z" fill="#1C1C1C" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="fwRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2430" />
      <stop offset="100%" stop-color="#C20010" />
    </linearGradient>
    <filter id="fwDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Official Footwork Triple Chevron Emblem -->
  <g transform="translate(8, 12)" filter="url(#fwDrop)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#0E1217" stroke="#252D38" stroke-width="1.5" />
    <!-- Triple Red Chevrons Pointing Right -->
    <path d="M 12 18 L 22 30 L 12 42 L 18 42 L 28 30 L 18 18 Z" fill="url(#fwRed)" />
    <path d="M 24 18 L 34 30 L 24 42 L 30 42 L 40 30 L 30 18 Z" fill="url(#fwRed)" />
    <path d="M 36 18 L 46 30 L 36 42 L 42 42 L 52 30 L 42 18 Z" fill="#FFFFFF" />
  </g>

  <!-- Right: FOOTWORK ARROWS Typography -->
  <g transform="translate(76, 0)">
    <text x="0" y="38" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="20" font-weight="900" font-style="italic" fill="url(#fwRed)" letter-spacing="1">FOOTWORK</text>
    <text x="1" y="58" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="19" font-weight="900" font-style="italic" fill="#111111" letter-spacing="1.5">ARROWS</text>
    <rect x="0" y="66" width="88" height="3.5" rx="1.5" fill="url(#fwRed)" />
  </g>
</svg>
      <stop offset="0%" stop-color="#FFF200" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <linearGradient id="ferModRosso" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E00" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>
    <filter id="ferModShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>

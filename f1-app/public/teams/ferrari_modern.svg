    <text x="47" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#09090B" text-anchor="middle">F</text>
  </g>

  <!-- Typography Block: Contemporary Scuderia Ferrari (2020-2026) -->
  <g transform="translate(100, 24)">
    <g transform="translate(0, 0)">

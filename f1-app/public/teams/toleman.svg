<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Toleman Heritage Deep Royal Blue -->
    <linearGradient id="tolemanNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D66" />
      <stop offset="50%" stop-color="#001B44" />
      <stop offset="100%" stop-color="#000D26" />
    </linearGradient>

    <!-- Candy Red Gradient -->
    <linearGradient id="candyRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E38" />
      <stop offset="100%" stop-color="#C40018" />
    </linearGradient>

    <!-- Senna / Monaco Gold Accent -->
    <linearGradient id="goldLaurel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <filter id="tolemanShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Left Emblem: The Famous Toleman Motorsport Racing Shield & Keel Monogram -->
  <g transform="translate(10, 9)" filter="url(#tolemanShadow)">
    <!-- Base Plate Shield -->
    <rect x="0" y="0" width="77" height="77" rx="16" fill="url(#tolemanNavy)" stroke="#38B6FF" stroke-width="1.5" />
    
    <!-- Diagonal Racing Stripe Ribbons (Red, White, Cyan of TG183/TG184) -->
    <path d="M4 25 L29 4 L37 4 L8 33 Z" fill="#FF1E38" />
    <path d="M4 39 L39 4 L47 4 L10 47 Z" fill="#FFFFFF" />
    <path d="M4 53 L49 4 L57 4 L12 61 Z" fill="#38B6FF" />

    <!-- Center Disc with Toleman "T" Racing Speed Monogram -->
    <g transform="translate(38.5, 38.5)">
      <!-- Disc -->
      <circle cx="0" cy="0" r="22" fill="#001433" stroke="#FFFFFF" stroke-width="1.5" />
      
      <!-- Toleman Dynamic 'T' Monogram with Twin Sail Keels -->
      <!-- Crossbar -->
      <rect x="-14" y="-12" width="28" height="5" rx="2" fill="#FFFFFF" />
      <!-- Vertical Stem -->
      <path d="M-4,-7 L4,-7 L2,12 L-2,12 Z" fill="#FFFFFF" />
      <!-- Left Sail Fin (Candy Red) -->
      <path d="M-13,-5 L-4,-5 L-4,8 Z" fill="url(#candyRed)" />
      <!-- Right Sail Fin (Electric Cyan) -->
      <path d="M13,-5 L4,-5 L4,8 Z" fill="#38B6FF" />
    </g>

    <!-- Golden Championship/Podium Star at Base (Monaco 1984 Ayrton Senna) -->
    <polygon points="38.5,67 40,70.5 44,70.5 41,73 42.5,77 38.5,74.5 34.5,77 36,73 33,70.5 37,70.5" fill="url(#goldLaurel)" />
  </g>

  <!-- Right Typography: TOLEMAN MOTORSPORT CANDY HART -->
  <g transform="translate(98, 13)">
    <!-- Top Speed Blade Accent in Red, White & Blue -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="45" height="3" rx="1.5" fill="url(#candyRed)" />
      <rect x="49" y="0" width="45" height="3" rx="1.5" fill="#FFFFFF" />
      <rect x="98" y="0" width="40" height="3" rx="1.5" fill="#38B6FF" />
    </g>

    <!-- Main Wordmark: TOLEMAN -->
    <text x="0" y="28" font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" font-size="27" fill="#FFFFFF" letter-spacing="2.5">
      TOLEMAN
    </text>

    <!-- Sub-Wordmark: MOTORSPORT -->
    <text x="0" y="47" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="800" font-size="12" fill="#38B6FF" letter-spacing="4">
      MOTORSPORT
    </text>

    <!-- Subtitle: CANDY · HART TURBO · 1984 SENNA ERA -->
    <g transform="translate(0, 62)">
      <!-- Candy Mini Badge -->
      <rect x="0" y="-8.5" width="38" height="11" rx="5.5" fill="url(#candyRed)" />
      <text x="19" y="-0.5" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive, sans-serif" 
            font-size="9" fill="#FFFFFF" font-style="italic" font-weight="bold">
        Candy
      </text>

      <!-- Subtitle Text -->
      <text x="44" y="0" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
            font-weight="700" font-size="9" fill="#C0D4EC" letter-spacing="2">
        HART TURBO F1 · 1984
      </text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="100%" height="100%">
  <defs>
    <!-- Virgin Red Gradient -->
    <linearGradient id="vrVirginRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E38" />
      <stop offset="60%" stop-color="#E10A1A" />
      <stop offset="100%" stop-color="#B3000E" />
    </linearGradient>

    <!-- Carbon Dark Gradient -->
    <linearGradient id="vrCarbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C323B" />
      <stop offset="100%" stop-color="#14171C" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="vrShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#vrShadow)">
    <!-- Dynamic Left Accent Checkered Slash -->
    <g transform="translate(6, 12)">
      <polygon points="0,0 8,0 16,60 8,60" fill="url(#vrVirginRed)" />
      <polygon points="9,0 15,0 23,60 17,60" fill="url(#vrCarbon)" />
    </g>

    <!-- Large Iconic Virgin Script -->
    <g transform="translate(30, 48)">
      <text x="0" y="0" font-family="'Brush Script MT', 'Segoe Script', 'Great Vibes', cursive, sans-serif" font-size="48" font-weight="bold" font-style="italic" fill="url(#vrVirginRed)" stroke="#FFFFFF" stroke-width="0.8" paint-order="stroke fill" letter-spacing="0.5">Virgin</text>
    </g>

    <!-- RACING Typography -->
    <text x="32" y="68" font-family="'Titillium Web', system-ui, Arial Black, sans-serif" font-size="14.5" font-weight="900" fill="url(#vrCarbon)" letter-spacing="7">RACING</text>

    <!-- Red Aerodynamic Base Stripe -->
    <path d="M 32,74 L 165,74 L 160,77 L 32,77 Z" fill="url(#vrVirginRed)" />
  </g>
</svg>

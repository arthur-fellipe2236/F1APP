<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="100%" height="100%">
  <defs>
    <!-- Marussia Vivid Red / Orange Gradient -->
    <linearGradient id="marussiaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3A00" />
      <stop offset="50%" stop-color="#E51900" />
      <stop offset="100%" stop-color="#B20C00" />
    </linearGradient>

    <!-- Carbon Black Gradient -->
    <linearGradient id="marussiaBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D323B" />
      <stop offset="100%" stop-color="#14171C" />
    </linearGradient>

    <!-- Chrome / White Highlight -->
    <linearGradient id="marussiaWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="marShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Left: Marussia Winged "M" Delta Crest -->
  <g transform="translate(8, 7)" filter="url(#marShadow)">
    <!-- Main Red Supersonic Delta Wing Outer Chevron -->
    <path d="M 0,10 C 3,5 7,1 12,0 C 22,0 30,16 35,26 C 40,16 48,0 58,0 C 63,1 67,5 70,10 C 69,28 61,50 47,65 C 44,68 41,71 35,71 C 29,71 26,68 23,65 C 9,50 1,28 0,10 Z" fill="url(#marussiaRed)" stroke="#FFFFFF" stroke-width="1.6" />

    <!-- Inner Black & White Aerodynamic Core -->
    <!-- Center V cutout in white -->
    <path d="M 35,23 L 49,42 C 45,54 39,60 35,62 C 31,60 25,54 21,42 Z" fill="url(#marussiaBlack)" stroke="#FFFFFF" stroke-width="1" />
    <!-- Center Red Core -->
    <polygon points="35,32 43,45 35,53 27,45" fill="url(#marussiaRed)" />
    <!-- White Inner Accents -->
    <line x1="35" y1="2" x2="35" y2="22" stroke="#FFFFFF" stroke-width="1.5" />
    <polygon points="35,16 38,20 32,20" fill="#FFFFFF" />
  </g>

  <!-- Right: MARUSSIA F1 TEAM Typography -->
  <g filter="url(#marShadow)">
    <!-- MARUSSIA in Bold Geometric Capitals -->
    <text x="86" y="38" font-family="'Titillium Web', system-ui, Arial Black, sans-serif" font-size="19" font-weight="900" fill="#14171C" stroke="#FFFFFF" stroke-width="0.7" paint-order="stroke fill" letter-spacing="1.2">MARUSSIA</text>

    <!-- F1 TEAM in Vibrant Marussia Red -->
    <text x="87" y="58" font-family="'Titillium Web', system-ui, sans-serif" font-size="12" font-weight="900" fill="url(#marussiaRed)" letter-spacing="3.8">F1 TEAM</text>

    <!-- Speed underline -->
    <path d="M 87,66 L 166,66 L 162,69 L 87,69 Z" fill="url(#marussiaRed)" />
    <circle cx="166" cy="67.5" r="1.5" fill="#14171C" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 85" width="240" height="85">
  <defs>
    <!-- Silver chrome gradient for the Mercedes star -->
    <linearGradient id="starLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#DCE2E6" />
      <stop offset="70%" stop-color="#9AA3AA" />
      <stop offset="100%" stop-color="#4B545B" />
    </linearGradient>
    <linearGradient id="starDark" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#333E46" />
      <stop offset="50%" stop-color="#6A757D" />
      <stop offset="100%" stop-color="#BCC5CB" />
    </linearGradient>
    <linearGradient id="petronasCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A19B" />
      <stop offset="100%" stop-color="#00D2C8" />
    </linearGradient>
  </defs>
  <!-- Chrome Mercedes Star on Left -->
  <g transform="translate(14, 10)">
    <!-- Outer Ring -->
    <circle cx="32" cy="32" r="30" fill="none" stroke="url(#starLight)" stroke-width="4.5" />
    <circle cx="32" cy="32" r="28" fill="none" stroke="#252C32" stroke-width="1.2" opacity="0.6" />
    <!-- Center 3-Pointed Star -->
    <!-- Top point -->
    <polygon points="32,6 30,32 32,32" fill="url(#starLight)" />
    <polygon points="32,6 34,32 32,32" fill="url(#starDark)" />
    <!-- Bottom Right point -->
    <polygon points="54,46 32,30 32,32" fill="url(#starLight)" />
    <polygon points="54,46 32,34 32,32" fill="url(#starDark)" />
    <!-- Bottom Left point -->
    <polygon points="10,46 32,34 32,32" fill="url(#starLight)" />
    <polygon points="10,46 32,30 32,32" fill="url(#starDark)" />
  </g>
  <!-- Mercedes-AMG Petronas Typography on Right -->
  <text x="86" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="20" font-weight="900" fill="#20262B" letter-spacing="0.5">MERCEDES-AMG</text>
  <text x="86" y="61" font-family="system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="22" font-weight="900" fill="url(#petronasCyan)" letter-spacing="1">PETRONAS</text>
  <text x="87" y="74" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#6A757D" letter-spacing="3.5">FORMULA ONE TEAM</text>
</svg>

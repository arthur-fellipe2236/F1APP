<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mclRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E17" />
      <stop offset="100%" stop-color="#D60000" />
    </linearGradient>
    <linearGradient id="mclSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A0A5B0" />
    </linearGradient>
    <filter id="mclDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left Emblem: The Iconic 1980s Marlboro-McLaren Project Four Chevron Crest -->
  <g transform="translate(14, 12)" filter="url(#mclDrop)">
    <!-- Base Shield / Rounded Container -->
    <rect x="0" y="0" width="70" height="71" rx="10" fill="#111317" stroke="#333742" stroke-width="1.5" />
    <rect x="3" y="3" width="64" height="65" rx="8" fill="#181B22" />

    <!-- Chevron Flag Top Section (White field) -->
    <path d="M 6 6 L 64 6 L 64 36 L 35 56 L 6 36 Z" fill="#FFFFFF" />

    <!-- Red Iconic Chevron Arrow Point (Marlboro/McLaren) -->
    <path d="M 6 6 L 64 6 L 64 26 L 35 48 L 6 26 Z" fill="url(#mclRedGrad)" />

    <!-- Subtle Chevron Inner Highlight -->
    <path d="M 12 9 L 58 9 L 58 22 L 35 40 L 12 22 Z" fill="#FF4430" opacity="0.4" />

    <!-- Speed Lines on White Lower Chevron -->
    <path d="M 22 41 L 35 50 L 48 41" fill="none" stroke="#D60000" stroke-width="2" stroke-linecap="round" />

    <!-- MP4 / Project Four Heritage Monogram -->
    <text x="35" y="63" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#E5E7EB" text-anchor="middle" letter-spacing="1">PROJECT 4</text>
  </g>

  <!-- McLaren Typography -->
  <g transform="translate(98, 20)">
    <!-- Heritage Era Pill: 1980 - 1984 ERA -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="15" rx="3" fill="#D60000" fill-opacity="0.2" stroke="#FF2E17" stroke-width="0.8" />
      <circle cx="8" cy="7.5" r="2.5" fill="#FF2E17" />
      <text x="16" y="11" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#FF5240" letter-spacing="1.2">WORLD CHAMPION 1984</text>
    </g>

    <!-- Main Wordmark: MCLAREN in classic bold motorsport italic -->
    <g transform="translate(0, 36)">
      <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="28" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="0.5">MCLAREN</text>
      <!-- Dual Racing Chevron Wings right after the wordmark -->
      <path d="M 172 -18 L 186 -5 L 172 8 L 165 4 L 175 -5 L 165 -14 Z" fill="#FF2E17" />
      <path d="M 183 -18 L 197 -5 L 183 8 L 176 4 L 186 -5 L 176 -14 Z" fill="#D60000" />
    </g>

    <!-- Subtitle: FORMULA 1 TEAM -->
    <g transform="translate(1, 51)">
      <text x="0" y="0" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#CBD5E1" letter-spacing="3.2">FORMULA 1 TEAM</text>
    </g>

    <!-- Underline Accent Bar -->
    <line x1="0" y1="58" x2="225" y2="58" stroke="#333A48" stroke-width="1.5" />
    <line x1="0" y1="58" x2="65" y2="58" stroke="#FF2E17" stroke-width="2.5" />
    <line x1="68" y1="58" x2="88" y2="58" stroke="#FFFFFF" stroke-width="2.5" />
  </g>
</svg>

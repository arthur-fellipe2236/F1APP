<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 95" width="100%" height="100%">
  <defs>
    <!-- Tyrrell Deep Midnight Navy Gradient -->
    <linearGradient id="tyrrellNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002244" />
      <stop offset="50%" stop-color="#00142A" />
      <stop offset="100%" stop-color="#000A17" />
    </linearGradient>

    <!-- Candy Vibrant Racing Red Gradient -->
    <linearGradient id="candyRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A2E" />
      <stop offset="100%" stop-color="#C40A1A" />
    </linearGradient>

    <!-- Braun Precision Graphite Gradient -->
    <linearGradient id="braunGraphite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D323B" />
      <stop offset="100%" stop-color="#15171C" />
    </linearGradient>

    <!-- Speed Cyan Accent Gradient -->
    <linearGradient id="speedCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>

    <filter id="tyrrellShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Left Emblem: Tyrrell Speed Shield with Dual Racing Stripes -->
  <g transform="translate(10, 9)" filter="url(#tyrrellShadow)">
    <!-- Base Plate Shield -->
    <rect x="0" y="0" width="77" height="77" rx="16" fill="url(#tyrrellNavy)" stroke="#00A2E8" stroke-width="1.5" />
    
    <!-- Diagonal Speed Chevrons (Classic 1970s-80s Tyrrell livery) -->
    <path d="M4 22 L26 4 L34 4 L8 30 Z" fill="#00D2FF" opacity="0.8" />
    <path d="M4 36 L36 4 L44 4 L10 44 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Center 'T' Racing Monogram Emblem -->
    <g transform="translate(38.5, 41)">
      <!-- Outer Ring -->
      <circle cx="0" cy="0" r="23" fill="#001830" stroke="#00D2FF" stroke-width="1.5" />
      <!-- Inner Ring -->
      <circle cx="0" cy="0" r="20" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-dasharray="2,2" />
      <!-- Dynamic Italic T Monogram -->
      <path d="M-13,-9 L13,-9 L11,-4 L2,-4 L-1,12 L-6,12 L-3,-4 L-12,-4 Z" fill="#FFFFFF" />
      <path d="M-1,-9 L13,-9 L11,-4 L4,-4 L1,12 L-2,12 L1,-4 L-1,-4 Z" fill="#00D2FF" />
    </g>

    <!-- Bottom Championship Laurel Star -->
    <polygon points="38.5,67 40,71 44.5,71 41,73.5 42.5,77.5 38.5,75 34.5,77.5 36,73.5 32.5,71 37,71" fill="#FFD700" />
  </g>

  <!-- Right Side: Tyrrell Wordmark & Official Candy Braun Badges -->
  <g transform="translate(98, 12)">
    <!-- Main Tyrrell Wordmark with Signature Script/Italic Flow -->
    <g transform="translate(0, 0)">
      <text x="0" y="27" font-family="'Brush Script MT', 'Bickham Script Pro', 'Segoe Script', cursive, sans-serif" 
            font-weight="bold" font-size="34" fill="#FFFFFF" font-style="italic" letter-spacing="1">
        Tyrrell
      </text>
      <!-- Dual Racing Line Under Tyrrell -->
      <rect x="112" y="16" width="130" height="2" rx="1" fill="#00D2FF" opacity="0.7" />
      <rect x="125" y="22" width="117" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.5" />
    </g>

    <!-- Sponsor Badges: Candy & BRAUN -->
    <g transform="translate(0, 36)">
      <!-- CANDY SPONSOR BADGE -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="84" height="23" rx="11.5" fill="url(#candyRed)" stroke="#FFFFFF" stroke-width="1.2" />
        <!-- Candy Stylized Signature Script -->
        <text x="42" y="16.5" text-anchor="middle" font-family="'Brush Script MT', 'Helvetica Neue', Arial, sans-serif" 
              font-weight="bold" font-size="16" fill="#FFFFFF" font-style="italic" letter-spacing="0.5">
          Candy
        </text>
      </g>

      <!-- BRAUN SPONSOR BADGE -->
      <g transform="translate(92, 0)">
        <rect x="0" y="0" width="84" height="23" rx="11.5" fill="url(#braunGraphite)" stroke="#4A5568" stroke-width="1.2" />
        <!-- Braun Iconic Industrial Wordmark with Raised 'A' -->
        <g transform="translate(42, 16.5)">
          <text text-anchor="middle" font-family="'Helvetica Neue', 'Arial Black', sans-serif" 
                font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="1.8">
            BR<tspan font-size="14.5" dy="-1.5">A</tspan><tspan font-size="12" dy="1.5">UN</tspan>
          </text>
        </g>
      </g>
    </g>

    <!-- Subtitle: TYRRELL CANDY BRAUN · F1 -->
    <g transform="translate(0, 71)">
      <rect x="0" y="-8.5" width="3" height="9.5" rx="1" fill="#00D2FF" />
      <text x="8" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" 
            font-weight="700" font-size="9.5" fill="#A8C8E6" letter-spacing="2.5">
        TYRRELL CANDY BRAUN · F1
      </text>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="lyncarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042614" />
      <stop offset="50%" stop-color="#02140A" />
      <stop offset="100%" stop-color="#010804" />
    </linearGradient>
    <linearGradient id="lyncarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEB3B" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
    <filter id="lysh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="170" height="85" rx="10" fill="url(#lyncarBg)" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#0D592C" stroke-width="1.2" />
  <!-- British Green & Gold Accent Bar -->
  <rect x="12" y="2" width="146" height="3" fill="url(#lyncarGold)" rx="1" />
  <!-- Lyncar Winged "L" Emblem -->
  <g transform="translate(12, 16)" filter="url(#lysh)">
    <circle cx="25" cy="25" r="23" fill="#031A0D" stroke="url(#lyncarGold)" stroke-width="2" />
    <!-- Winged "L" -->
    <path d="M 18 14 L 24 14 L 24 30 L 34 30 L 34 34 L 18 34 Z" fill="url(#lyncarGold)" />
    <!-- Speed Wing -->
    <path d="M 24 18 Q 36 16 38 24 Q 32 24 24 22 Z" fill="#FFFFFF" />
  </g>
  <!-- Typography -->
  <g transform="translate(68, 20)" filter="url(#lysh)">
    <text x="0" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="20" letter-spacing="1.5">LYNCAR</text>
    <text x="1" y="35" fill="url(#lyncarGold)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8" letter-spacing="3.2">ENGINEERING F1</text>
    <line x1="1" y1="40" x2="88" y2="40" stroke="url(#lyncarGold)" stroke-width="1.2" />
    <text x="1" y="50" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="6.5" letter-spacing="2">JOHN NICHOLSON • 006</text>
  </g>
</svg>
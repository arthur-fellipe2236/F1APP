<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="jbhSnakeYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF200" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <filter id="jSnakeDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left: Jordan 1997 Bitten Hisses Snake Head Emblem -->
  <g transform="translate(8, 10)" filter="url(#jSnakeDrop)">
    <rect x="0" y="0" width="62" height="62" rx="14" fill="url(#jbhSnakeYellow)" stroke="#111111" stroke-width="2.5" />
    <!-- Menacing Snake Head Silhouettes -->
    <path d="M 12 44 C 14 26 22 18 31 16 C 40 18 48 26 50 44 C 44 46 38 48 31 48 C 24 48 18 46 12 44 Z" fill="#111111" />
    <!-- Yellow Scaled Eyes with Slit Pupils -->
    <ellipse cx="23" cy="29" rx="4.5" ry="6.5" transform="rotate(-15, 23, 29)" fill="url(#jbhSnakeYellow)" />
    <ellipse cx="39" cy="29" rx="4.5" ry="6.5" transform="rotate(15, 39, 29)" fill="url(#jbhSnakeYellow)" />
    <line x1="23" y1="24" x2="23" y2="34" stroke="#111111" stroke-width="2.2" stroke-linecap="round" />
    <line x1="39" y1="24" x2="39" y2="34" stroke="#111111" stroke-width="2.2" stroke-linecap="round" />
    <!-- Fangs -->
    <polygon points="25,44 28,44 26.5,52" fill="#FFFFFF" />
    <polygon points="34,44 37,44 35.5,52" fill="#FFFFFF" />
    <!-- Forked Red Tongue -->
    <path d="M 31 46 L 31 54 L 27 58 M 31 54 L 35 58" stroke="#E10600" stroke-width="1.8" fill="none" stroke-linecap="round" />
  </g>

  <!-- Right: BITTEN HISSES Typography -->
  <g transform="translate(76, 0)">
    <text x="0" y="36" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="20" font-weight="900" font-style="italic" fill="#111111" letter-spacing="0.5">BITTEN</text>
    <text x="0" y="55" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="20" font-weight="900" font-style="italic" fill="#111111" letter-spacing="0.5">HISSES</text>
    <text x="1" y="70" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="900" font-style="italic" fill="#444444" letter-spacing="3">JORDAN F1</text>
    <rect x="0" y="74" width="88" height="3" rx="1.5" fill="url(#jbhSnakeYellow)" stroke="#111" stroke-width="0.6" />
  </g>
</svg>
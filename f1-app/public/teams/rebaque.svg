<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="rebaqueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2010" />
      <stop offset="50%" stop-color="#241107" />
      <stop offset="100%" stop-color="#120803" />
    </linearGradient>
    <linearGradient id="rebaqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#E5A812" />
      <stop offset="100%" stop-color="#A67405" />
    </linearGradient>
    <filter id="rsh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="170" height="85" rx="10" fill="url(#rebaqueBg)" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#5E381C" stroke-width="1.2" />
  <!-- Mexican Flag Accent -->
  <rect x="12" y="2" width="46" height="3" fill="#006847" rx="1" />
  <rect x="58" y="2" width="48" height="3" fill="#FFFFFF" rx="1" />
  <rect x="106" y="2" width="46" height="3" fill="#CE1126" rx="1" />
  <!-- Gold Speed Bars -->
  <polygon points="135,5 142,5 125,80 118,80" fill="url(#rebaqueGold)" opacity="0.6" />
  <polygon points="146,5 168,5 151,80 129,80" fill="url(#rebaqueGold)" opacity="0.85" />
  <!-- Rebaque Aztec Sun & Monogram Emblem -->
  <g transform="translate(12, 16)" filter="url(#rsh)">
    <circle cx="25" cy="25" r="23" fill="#1C0C04" stroke="url(#rebaqueGold)" stroke-width="2" />
    <circle cx="25" cy="25" r="19" fill="none" stroke="url(#rebaqueGold)" stroke-width="1" stroke-dasharray="3 2" />
    <!-- Stylized Eagle / HR Monogram -->
    <path d="M 16 16 L 25 10 L 34 16 L 31 32 L 25 39 L 19 32 Z" fill="url(#rebaqueGold)" />
    <polygon points="25,14 31,18 25,35 19,18" fill="#1C0C04" />
    <text x="25" y="28" fill="url(#rebaqueGold)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" text-anchor="middle">HR</text>
  </g>
  <!-- Typography -->
  <g transform="translate(68, 22)" filter="url(#rsh)">
    <text x="0" y="21" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="18.5" letter-spacing="1.5">REBAQUE</text>
    <text x="1" y="33" fill="url(#rebaqueGold)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8.5" letter-spacing="3.5">F1 TEAM • HR100</text>
    <line x1="1" y1="38" x2="60" y2="38" stroke="url(#rebaqueGold)" stroke-width="1.2" />
    <text x="1" y="48" fill="#D4B08A" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="6.5" letter-spacing="2">MEXICO • 1979</text>
  </g>
</svg>
      <circle cx="8" cy="7.5" r="2.5" fill="#0055FF" />
      <text x="16" y="11" font-family="'Titillium Web', sans-serif" font-size="8" font-weight="900" fill="#66A3FF" letter-spacing="1.2">JOHN SURTEES RACING</text>

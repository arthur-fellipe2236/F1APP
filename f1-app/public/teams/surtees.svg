<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <filter id="surShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g transform="translate(14, 11)" filter="url(#surShadow)">
    <rect x="0" y="0" width="72" height="73" rx="10" fill="#070B14" stroke="#1D2F54" stroke-width="1.5" />
    <rect x="3" y="3" width="66" height="67" rx="8" fill="#0A1833" />
    <!-- Surtees Arrow Monogram -->
    <circle cx="36" cy="36" r="24" fill="#0038A8" stroke="#FFFFFF" stroke-width="1.5" />
    <polygon points="36,18 48,46 36,40 24,46" fill="#FFFFFF" />
    <polygon points="36,26 42,44 36,41 30,44" fill="#0038A8" />
    <text x="36" y="55" font-family="'Arial Black', sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">TS</text>
  </g>

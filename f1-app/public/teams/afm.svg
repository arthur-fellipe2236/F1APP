<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="afmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D223F" />
      <stop offset="50%" stop-color="#061224" />
      <stop offset="100%" stop-color="#020710" />
    </linearGradient>
    <linearGradient id="afmWing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="afmsh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <!-- Background & Outer Border -->
  <rect width="170" height="85" rx="10" fill="url(#afmBg)" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#1E4E8C" stroke-width="1.2" />
  
  <!-- Bavarian Sky-Blue & Silver Accent Bar -->
  <rect x="12" y="2" width="70" height="3" fill="#38BDF8" rx="1" />
  <rect x="88" y="2" width="70" height="3" fill="#FFFFFF" rx="1" />
  
  <!-- Left Emblem: Aerodynamic Wings & Bavarian Crest Roundel -->
  <g transform="translate(10, 16)" filter="url(#afmsh)">
    <!-- Outer Wing Sprays -->
    <path d="M 6,24 Q 18,17 26,22 Q 18,27 6,24 Z" fill="url(#afmWing)" opacity="0.9" />
    <path d="M 46,24 Q 34,17 26,22 Q 34,27 46,24 Z" fill="url(#afmWing)" opacity="0.9" />
    <!-- Center Emblem Circle -->
    <circle cx="26" cy="25" r="21" fill="#040E1C" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="26" cy="25" r="17.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6" />
    <!-- Bavarian Diamond Pattern Inlay -->
    <polygon points="26,11 31,17 26,23 21,17" fill="#38BDF8" opacity="0.8" />
    <polygon points="26,27 31,33 26,39 21,33" fill="#38BDF8" opacity="0.8" />
    <polygon points="31,19 36,25 31,31 26,25" fill="#FFFFFF" opacity="0.9" />
    <polygon points="21,19 26,25 21,31 16,25" fill="#FFFFFF" opacity="0.9" />
    <!-- Monogram Ring Overlap -->
    <circle cx="26" cy="25" r="9" fill="#030A14" stroke="#38BDF8" stroke-width="1.2" />
    <text x="26" y="29" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" text-anchor="middle" letter-spacing="0.5">M</text>
  </g>
  
  <!-- Right Typography Block -->
  <g transform="translate(67, 18)" filter="url(#afmsh)">
    <text x="0" y="22" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2">AFM</text>
    <text x="1" y="34" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="7" letter-spacing="1.4">ALEX VON FALKENHAUSEN</text>
    <line x1="1" y1="39" x2="92" y2="39" stroke="#38BDF8" stroke-width="1.2" opacity="0.8" />
    <text x="1" y="49" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="6.2" letter-spacing="1.6">MOTORENBAU • MÜNCHEN 52-53</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="jbhYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF533" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
    <filter id="jbhDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left: Jordan 1998-2000 Buzzin Hornets Wasp Head Emblem -->
  <g transform="translate(8, 10)" filter="url(#jbhDrop)">
    <!-- Base Hex Shield in Yellow -->
    <rect x="0" y="0" width="62" height="62" rx="14" fill="url(#jbhYellow)" stroke="#111111" stroke-width="2.5" />
    <!-- Wasp Fierce Compound Eyes in Black & White Glint -->
    <ellipse cx="20" cy="27" rx="8" ry="14" transform="rotate(-20, 20, 27)" fill="#111111" />
    <ellipse cx="42" cy="27" rx="8" ry="14" transform="rotate(20, 42, 27)" fill="#111111" />
    <ellipse cx="19" cy="24" rx="2.5" ry="5" fill="#FFFFFF" opacity="0.9" />
    <ellipse cx="43" cy="24" rx="2.5" ry="5" fill="#FFFFFF" opacity="0.9" />
    <!-- Antennae -->
    <path d="M 23 15 Q 16 8 8 10" stroke="#111111" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 39 15 Q 46 8 54 10" stroke="#111111" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Stinger & Mandibles in Black -->
    <polygon points="26,38 36,38 31,52" fill="#111111" />
    <line x1="16" y1="44" x2="26" y2="40" stroke="#111111" stroke-width="2" />
    <line x1="46" y1="44" x2="36" y2="40" stroke="#111111" stroke-width="2" />
  </g>

  <!-- Right: BUZZIN HORNETS Typography -->
  <g transform="translate(76, 0)">
    <text x="0" y="36" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="20" font-weight="900" font-style="italic" fill="#111111" letter-spacing="0.5">BUZZIN</text>
    <text x="0" y="55" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="20" font-weight="900" font-style="italic" fill="#111111" letter-spacing="0.5">HORNETS</text>
    <text x="1" y="70" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="900" font-style="italic" fill="#444444" letter-spacing="3">JORDAN F1</text>
    <rect x="0" y="74" width="88" height="3" rx="1.5" fill="url(#jbhYellow)" stroke="#111" stroke-width="0.6" />
  </g>
</svg>
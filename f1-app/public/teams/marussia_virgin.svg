<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 85" width="100%" height="100%">
  <defs>
    <!-- Marussia Red Gradient -->
    <linearGradient id="mvMarussiaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3A00" />
      <stop offset="50%" stop-color="#E51900" />
      <stop offset="100%" stop-color="#B20C00" />
    </linearGradient>

    <!-- Virgin Red Gradient -->
    <linearGradient id="mvVirginRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A35" />
      <stop offset="100%" stop-color="#D1001C" />
    </linearGradient>

    <!-- Chrome / Carbon Gradients -->
    <linearGradient id="mvCarbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D323B" />
      <stop offset="100%" stop-color="#14171C" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="mvShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Left: Marussia Winged "M" Delta Crest -->
  <g transform="translate(6, 9)" filter="url(#mvShadow)">
    <path d="M 0,9 C 2.5,4.5 6,1 10,0 C 19,0 26,14 30,23 C 34,14 41,0 50,0 C 54,1 57.5,4.5 60,9 C 59,25 52,44 40,58 C 38,60 35,63 30,63 C 25,63 22,60 20,58 C 8,44 1,25 0,9 Z" fill="url(#mvMarussiaRed)" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M 30,20 L 42,37 C 38,48 33,53 30,55 C 27,53 22,48 18,37 Z" fill="url(#mvCarbon)" stroke="#FFFFFF" stroke-width="0.8" />
    <polygon points="30,28 37,40 30,47 23,40" fill="url(#mvMarussiaRed)" />
  </g>

  <!-- Center Divider Bar -->
  <line x1="72" y1="12" x2="72" y2="73" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right: MARUSSIA VIRGIN RACING Typography -->
  <g filter="url(#mvShadow)">
    <!-- MARUSSIA Header -->
    <text x="80" y="24" font-family="'Titillium Web', system-ui, Arial Black, sans-serif" font-size="11.5" font-weight="900" fill="#14171C" letter-spacing="2.8">MARUSSIA</text>

    <!-- Virgin Signature Script in Bold Red -->
    <g transform="translate(80, 52)">
      <text x="0" y="0" font-family="'Brush Script MT', 'Segoe Script', 'Great Vibes', cursive, sans-serif" font-size="30" font-weight="bold" font-style="italic" fill="url(#mvVirginRed)">Virgin</text>
    </g>

    <!-- RACING Subtitle -->
    <text x="82" y="69" font-family="'Titillium Web', system-ui, sans-serif" font-size="11" font-weight="900" fill="#14171C" letter-spacing="4.8">RACING</text>

    <!-- Red underline -->
    <path d="M 82,74 L 168,74 L 164,76.5 L 82,76.5 Z" fill="url(#mvVirginRed)" />
  </g>
</svg>

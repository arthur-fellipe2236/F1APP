<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Renault Yellow Gradient -->
    <linearGradient id="renYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF200" />
      <stop offset="60%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#E59E00" />
    </linearGradient>

    <!-- Elf Blue Gradient -->
    <linearGradient id="elfBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0044B3" />
      <stop offset="100%" stop-color="#002266" />
    </linearGradient>

    <filter id="renShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left Emblem: Renault Vasarely Geometric Diamond on Dark Shield -->
  <g transform="translate(14, 11)" filter="url(#renShadow)">
    <!-- Base Shield -->
    <rect x="0" y="0" width="72" height="73" rx="10" fill="#0C0D11" stroke="#2D313D" stroke-width="1.5" />
    <rect x="3" y="3" width="66" height="67" rx="8" fill="#141720" />

    <!-- Renault Diamond Outer Band (Yellow) -->
    <polygon points="36,9 58,36 36,64 14,36" fill="url(#renYellow)" />

    <!-- Diamond Inner Stripe 1 (Black cut) -->
    <polygon points="36,16 52,36 36,57 20,36" fill="#141720" />

    <!-- Diamond Inner Ring 2 (Yellow) -->
    <polygon points="36,22 47,36 36,51 25,36" fill="url(#renYellow)" />

    <!-- Diamond Core Hole -->
    <polygon points="36,29 42,36 36,44 30,36" fill="#141720" />

    <!-- Elf Corner Accent Pill -->
    <g transform="translate(42, 45)">
      <rect x="0" y="0" width="22" height="20" rx="3" fill="url(#elfBlue)" stroke="#FFFFFF" stroke-width="0.8" />
      <!-- Elf Inverted Chevron Sign -->
      <polygon points="6,15 11,5 13,5 8,15" fill="#FFFFFF" />
      <polygon points="12,15 17,5 15,5 10,15" fill="#E10600" />
    </g>
  </g>

  <!-- Renault Turbo Typography -->
  <g transform="translate(100, 20)">
    <!-- Era Badge: ÉQUIPE RENAULT ELF -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="136" height="15" rx="3" fill="#FFD000" fill-opacity="0.18" stroke="#FFD000" stroke-width="0.8" />
      <circle cx="8" cy="7.5" r="2.5" fill="#FFD000" />
      <text x="16" y="11" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#FFE033" letter-spacing="1.2">ÉQUIPE RENAULT ELF</text>
    </g>

    <!-- Main Wordmark: RENAULT -->
    <g transform="translate(0, 36)">
      <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="28" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="0.5">RENAULT</text>

      <!-- TURBO text with speed aesthetic -->
      <g transform="translate(152, -2)">
        <rect x="0" y="-17" width="66" height="22" rx="4" fill="#0C0D11" stroke="#FFD000" stroke-width="1.2" />
        <text x="33" y="-1" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" font-style="italic" fill="url(#renYellow)" text-anchor="middle" letter-spacing="1">TURBO</text>
      </g>
    </g>

    <!-- Subtitle: FORMULA 1 TEAM -->
    <g transform="translate(1, 51)">
      <text x="0" y="0" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#CBD5E1" letter-spacing="3.2">FORMULA 1 TEAM · 1980-1984</text>
    </g>

    <!-- Bottom Accent Stripes: Yellow & Elf Blue -->
    <line x1="0" y1="58" x2="225" y2="58" stroke="#252A36" stroke-width="1.5" />
    <line x1="0" y1="58" x2="70" y2="58" stroke="#FFD000" stroke-width="2.5" />
    <line x1="73" y1="58" x2="105" y2="58" stroke="#0055FF" stroke-width="2.5" />
  </g>
</svg>

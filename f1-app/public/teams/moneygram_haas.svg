<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="100%" height="100%">
  <defs>
    <!-- Haas Official Red Gradient -->
    <linearGradient id="haasRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A1B" />
      <stop offset="60%" stop-color="#DA291C" />
      <stop offset="100%" stop-color="#B0150B" />
    </linearGradient>

    <!-- Chrome/White Light Highlight -->
    <linearGradient id="haasWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="haasShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Left Side: Iconic Haas Red Roundel Emblem -->
  <g transform="translate(6, 4)" filter="url(#haasShadow)">
    <!-- Main Red Roundel -->
    <circle cx="38" cy="38" r="34" fill="url(#haasRedGrad)" stroke="#FFFFFF" stroke-width="1.8" />
    
    <!-- Outer accent ring -->
    <circle cx="38" cy="38" r="31" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.4" />

    <!-- Stylized Haas "H" Cutout in White -->
    <!-- Left vertical bar of H -->
    <path d="M 23,16 L 31,16 L 31,60 L 23,60 Z" fill="#FFFFFF" />
    <!-- Right vertical bar of H -->
    <path d="M 45,16 L 53,16 L 53,60 L 45,60 Z" fill="#FFFFFF" />
    <!-- Dynamic angled crossbar of H connecting the bars -->
    <polygon points="23,33 53,33 53,43 23,43" fill="#FFFFFF" />
    <!-- Racing diagonal slash cut through the H -->
    <polygon points="17,54 59,22 55,19 13,51" fill="url(#haasRedGrad)" />

    <!-- MoneyGram Swoosh Accent inside circle -->
    <circle cx="48" cy="24" r="5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="48" cy="24" r="3.2" fill="url(#haasRedGrad)" />
  </g>

  <!-- Right Side: MoneyGram HAAS F1 TEAM Typography -->
  <g filter="url(#haasShadow)">
    <!-- MoneyGram sponsor script -->
    <g transform="translate(82, 23)">
      <!-- MoneyGram dual red globe arc -->
      <circle cx="4" cy="-3" r="4.5" fill="#DA291C" stroke="#FFFFFF" stroke-width="0.8" />
      <path d="M 2,-7 C 6,-7 8,-4 8,-1 C 6,-1 4,-3 2,-7 Z" fill="#FFFFFF" />
      <text x="13" y="1" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" font-style="italic" fill="#FFFFFF" letter-spacing="0.2">MoneyGram</text>
    </g>

    <!-- Bold HAAS Title -->
    <text x="82" y="52" font-family="'Titillium Web', system-ui, Arial Black, sans-serif" font-size="28" font-weight="900" fill="url(#haasWhiteGrad)" letter-spacing="2">HAAS</text>

    <!-- F1 TEAM Subtitle with Red Accent Bar -->
    <text x="83" y="68" font-family="'Titillium Web', system-ui, sans-serif" font-size="9" font-weight="900" fill="#DA291C" letter-spacing="4.5">F1 TEAM</text>

    <!-- Base underline -->
    <path d="M 83,73 L 165,73 L 161,75 L 83,75 Z" fill="#DA291C" />
  </g>
</svg>

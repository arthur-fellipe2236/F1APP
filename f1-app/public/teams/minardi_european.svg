<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="euMinardiNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001838" />
      <stop offset="100%" stop-color="#000C1C" />
    </linearGradient>
    <filter id="euMinDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: European Minardi Shield with Circle of Stars -->
  <g transform="translate(8, 10)" filter="url(#euMinDrop)">
    <path d="M 6 6 L 56 6 L 56 36 C 56 50 31 60 31 60 C 31 60 6 50 6 36 Z" fill="url(#euMinardiNavy)" stroke="#D4AF37" stroke-width="2" />
    <!-- White / Gold European Stars & Falcon motif -->
    <path d="M 18 42 L 24 22 L 31 34 L 38 22 L 44 42 L 38 42 L 35 29 L 31 36 L 27 29 L 24 42 Z" fill="#FFFFFF" />
    <circle cx="31" cy="15" r="2.5" fill="#FFD700" />
    <circle cx="21" cy="18" r="2" fill="#FFD700" />
    <circle cx="41" cy="18" r="2" fill="#FFD700" />
  </g>

  <!-- Right: EUROPEAN MINARDI Typography -->
  <g transform="translate(72, 0)">
    <text x="0" y="32" font-family="'Titillium Web', system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#00356B" letter-spacing="2">EUROPEAN</text>
    <text x="0" y="55" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="24" font-weight="900" font-style="italic" fill="#111111" letter-spacing="1">MINARDI</text>
    <text x="1" y="70" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="900" font-style="italic" fill="#FFB800" letter-spacing="3">F1 TEAM</text>
    <rect x="0" y="74" width="92" height="3" rx="1.5" fill="#00356B" />
  </g>
</svg>
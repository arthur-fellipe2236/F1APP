<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <filter id="euMinDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Fundo Preto Oficial European Minardi -->
  <rect x="0" y="0" width="170" height="85" rx="10" fill="#0A0D12" />
  <rect x="1.5" y="1.5" width="167" height="82" rx="8.5" fill="none" stroke="#252D38" stroke-width="1.2" />

  <!-- Left: Escudo European Minardi com Estrelas Douradas -->
  <g transform="translate(8, 10)" filter="url(#euMinDrop)">
    <path d="M 6 6 L 56 6 L 56 36 C 56 50 31 60 31 60 C 31 60 6 50 6 36 Z" fill="#001838" stroke="#D4AF37" stroke-width="2.5" />
    <path d="M 18 42 L 24 22 L 31 34 L 38 22 L 44 42 L 38 42 L 35 29 L 31 36 L 27 29 L 24 42 Z" fill="#FFFFFF" />
    <circle cx="31" cy="14" r="2.8" fill="#FFD700" />
    <circle cx="20" cy="17" r="2.2" fill="#FFD700" />
    <circle cx="42" cy="17" r="2.2" fill="#FFD700" />
  </g>

  <!-- Right: Letras em Branco Puro -->
  <g transform="translate(72, 0)" filter="url(#euMinDrop)">
    <text x="0" y="32" font-family="'Titillium Web', system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" letter-spacing="2">EUROPEAN</text>
    <text x="0" y="56" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="26" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="1">MINARDI</text>
    <text x="1" y="70" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" font-style="italic" fill="#D4AF37" letter-spacing="3.5">F1 TEAM</text>
    <rect x="0" y="74" width="92" height="3" rx="1.5" fill="#FFFFFF" />
  </g>
</svg>
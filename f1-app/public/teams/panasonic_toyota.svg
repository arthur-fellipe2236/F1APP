<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 85" width="170" height="85">
  <defs>
    <linearGradient id="ptRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E34" />
      <stop offset="100%" stop-color="#C20012" />
    </linearGradient>
    <linearGradient id="ptBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066D6" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
    <filter id="ptDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left: Official Triple-Oval Toyota Emblem -->
  <g transform="translate(6, 12)" filter="url(#ptDrop)">
    <!-- Outer Horizontal Ellipse -->
    <ellipse cx="30" cy="30" rx="28" ry="19" fill="none" stroke="url(#ptRedGrad)" stroke-width="4.5" />
    <!-- Inner Vertical Ellipse -->
    <ellipse cx="30" cy="30" rx="9.5" ry="18" fill="none" stroke="url(#ptRedGrad)" stroke-width="4" />
    <!-- Inner Horizontal Ellipse -->
    <ellipse cx="30" cy="23.5" rx="18" ry="9" fill="none" stroke="url(#ptRedGrad)" stroke-width="4" />
  </g>

  <!-- Right: Panasonic Toyota Racing Typography -->
  <g transform="translate(70, 0)">
    <!-- Panasonic in Electric Blue -->
    <text x="0" y="27" font-family="'Titillium Web', system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="900" fill="url(#ptBlueGrad)" letter-spacing="0.5">Panasonic</text>
    <!-- TOYOTA in Vivid Red -->
    <text x="0" y="52" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial Black, sans-serif" font-size="24" font-weight="900" font-style="italic" fill="url(#ptRedGrad)" letter-spacing="1">TOYOTA</text>
    <!-- RACING in Carbon Black / Dark Graphite -->
    <text x="1" y="69" font-family="'Titillium Web', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="900" font-style="italic" fill="#222222" letter-spacing="3.5">RACING</text>
    <!-- Racing Speed Accent Bar -->
    <path d="M 0 74 L 90 74 L 85 77 L 0 77 Z" fill="url(#ptRedGrad)" />
    <path d="M 87 74 L 96 74 L 93 77 L 85 77 Z" fill="url(#ptBlueGrad)" />
  </g>
</svg>
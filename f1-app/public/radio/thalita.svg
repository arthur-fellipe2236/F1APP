<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e2029" />
      <stop offset="60%" stop-color="#0e0f14" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <!-- Metallic Ring Gradient -->
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4d57" />
      <stop offset="25%" stop-color="#2a2c33" />
      <stop offset="50%" stop-color="#686b77" />
      <stop offset="75%" stop-color="#1f2026" />
      <stop offset="100%" stop-color="#3c3e47" />
    </linearGradient>

    <!-- Red Neon Glow Gradient -->
    <linearGradient id="redNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A20" />
      <stop offset="50%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Microphone Body Gradient -->
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c2d35" />
      <stop offset="35%" stop-color="#555866" />
      <stop offset="70%" stop-color="#222329" />
      <stop offset="100%" stop-color="#141519" />
    </linearGradient>

    <!-- Chrome Grill Gradient -->
    <linearGradient id="grillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e92a0" />
      <stop offset="50%" stop-color="#d4d7e1" />
      <stop offset="100%" stop-color="#5a5c66" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Dark Base -->
  <circle cx="100" cy="100" r="98" fill="#060608" />

  <!-- Outer Metallic Bezel -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#metalRing)" stroke-width="3" />

  <!-- Inner Dark Badge Area -->
  <circle cx="100" cy="100" r="92" fill="url(#bgGrad)" />

  <!-- Red Racing Inner Accent Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#redNeon)" stroke-width="2" opacity="0.85" filter="url(#neonGlow)" />

  <!-- Carbon / Speed Accent Arc (Top Right to Bottom Left) -->
  <path d="M 28 65 A 86 86 0 0 1 172 65" fill="none" stroke="#E10600" stroke-width="1.5" stroke-dasharray="14 8" opacity="0.6" />
  <path d="M 32 140 A 86 86 0 0 0 168 140" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="8 6" opacity="0.3" />

  <!-- Radio Waves (Left Side) -->
  <path d="M 68 82 A 28 28 0 0 0 68 118" fill="none" stroke="url(#redNeon)" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="url(#neonGlow)" />
  <path d="M 54 72 A 44 44 0 0 0 54 128" fill="none" stroke="url(#redNeon)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  <path d="M 40 62 A 60 60 0 0 0 40 138" fill="none" stroke="url(#redNeon)" stroke-width="2" stroke-linecap="round" opacity="0.5" stroke-dasharray="6 4" />

  <!-- Radio Waves (Right Side) -->
  <path d="M 132 82 A 28 28 0 0 1 132 118" fill="none" stroke="url(#redNeon)" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="url(#neonGlow)" />
  <path d="M 146 72 A 44 44 0 0 1 146 128" fill="none" stroke="url(#redNeon)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  <path d="M 160 62 A 60 60 0 0 1 160 138" fill="none" stroke="url(#redNeon)" stroke-width="2" stroke-linecap="round" opacity="0.5" stroke-dasharray="6 4" />

  <!-- Soundwave Equalizer Bars below Mic -->
  <g opacity="0.85">
    <line x1="78" y1="148" x2="78" y2="154" stroke="#E10600" stroke-width="3" stroke-linecap="round" />
    <line x1="84" y1="145" x2="84" y2="157" stroke="#FF4D40" stroke-width="3" stroke-linecap="round" />
    <line x1="90" y1="142" x2="90" y2="160" stroke="#FF8533" stroke-width="3" stroke-linecap="round" />
    <line x1="96" y1="138" x2="96" y2="164" stroke="#FFB800" stroke-width="3" stroke-linecap="round" />
    <line x1="104" y1="138" x2="104" y2="164" stroke="#FFB800" stroke-width="3" stroke-linecap="round" />
    <line x1="110" y1="142" x2="110" y2="160" stroke="#FF8533" stroke-width="3" stroke-linecap="round" />
    <line x1="116" y1="145" x2="116" y2="157" stroke="#FF4D40" stroke-width="3" stroke-linecap="round" />
    <line x1="122" y1="148" x2="122" y2="154" stroke="#E10600" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Microphone Base / Neck Stand -->
  <path d="M 97 122 L 97 136 L 86 138 L 86 142 L 114 142 L 114 138 L 103 136 L 103 122 Z" fill="url(#metalRing)" />
  <rect x="94" y="139" width="12" height="3" rx="1.5" fill="#E10600" />

  <!-- Microphone Capsule Frame (U-shaped cradle) -->
  <path d="M 80 84 C 80 114 120 114 120 84" fill="none" stroke="url(#grillGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Microphone Body -->
  <rect x="87" y="62" width="26" height="42" rx="13" fill="url(#micGrad)" stroke="#1a1b20" stroke-width="1.5" />

  <!-- Microphone Grille Mesh (Top Half) -->
  <rect x="87" y="62" width="26" height="24" rx="13" fill="url(#grillGrad)" opacity="0.9" />
  <line x1="88" y1="70" x2="112" y2="70" stroke="#222" stroke-width="0.8" opacity="0.6" />
  <line x1="87" y1="75" x2="113" y2="75" stroke="#222" stroke-width="0.8" opacity="0.6" />
  <line x1="88" y1="80" x2="112" y2="80" stroke="#222" stroke-width="0.8" opacity="0.6" />
  <line x1="100" y1="62" x2="100" y2="86" stroke="#222" stroke-width="0.8" opacity="0.6" />

  <!-- Red Accent Band on Microphone -->
  <rect x="87" y="85" width="26" height="3.5" fill="#E10600" filter="url(#neonGlow)" />

  <!-- 'ON AIR' Glowing Status Pill -->
  <g transform="translate(71, 38)">
    <rect x="0" y="0" width="58" height="15" rx="7.5" fill="#140202" stroke="#E10600" stroke-width="1.5" />
    <circle cx="8" cy="7.5" r="3" fill="#FF1E10" filter="url(#neonGlow)" />
    <text x="16" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" letter-spacing="1.2">ON AIR</text>
  </g>

  <!-- Typography at Bottom: 'RÁDIO F1' -->
  <g transform="translate(100, 180)" text-anchor="middle">
    <!-- Red F1 Speed Stripe -->
    <path d="M -38 -2 L -28 -2 L -32 4 L -42 4 Z" fill="#E10600" />
    <text x="3" y="2" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="2.5">RÁDIO F1</text>
  </g>
</svg>

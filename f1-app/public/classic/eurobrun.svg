<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Walter Brun Competition Orange Gradient -->
    <linearGradient id="brunOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7700" />
      <stop offset="50%" stop-color="#FF4D00" />
      <stop offset="100%" stop-color="#CC2B00" />
    </linearGradient>

    <!-- Deep Carbon Anthracite Gradient -->
    <linearGradient id="euroDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1E24" />
      <stop offset="50%" stop-color="#101217" />
      <stop offset="100%" stop-color="#090A0D" />
    </linearGradient>

    <!-- Electric Orange Accent -->
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA040" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>

    <filter id="euroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Left Emblem: The Famous EuroBrun Intertwined 'EB' Crest with Swiss & Italian Ribbons -->
  <g transform="translate(10, 9)" filter="url(#euroShadow)">
    <!-- Base Plate Shield -->
    <rect x="0" y="0" width="77" height="77" rx="16" fill="url(#euroDark)" stroke="#FF5500" stroke-width="1.5" />
    
    <!-- Outer Racing Speed Ring in Orange -->
    <circle cx="38.5" cy="38.5" r="27" fill="none" stroke="url(#brunOrange)" stroke-width="2" />

    <!-- Center Disc -->
    <circle cx="38.5" cy="38.5" r="23" fill="url(#brunOrange)" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- The Authentic Intertwined 'EB' Monogram -->
    <g transform="translate(38.5, 38.5)">
      <!-- 'E' Component (Bold Italic Racing Serif) -->
      <path d="M-13,-11 L-2,-11 L-2,-7 L-8,-7 L-8,-2 L-3,-2 L-3,2 L-8,2 L-8,7 L-1,7 L-1,11 L-13,11 Z" 
            fill="#FFFFFF" />
      <!-- 'B' Component (Interlocking Double Loop in Pure White with Shadow) -->
      <path d="M-4,-11 L6,-11 C11,-11 14,-9 14,-5 C14,-2 11,0 7,0 C12,0 15,2 15,6 C15,10 11,11 5,11 L-4,11 L-4,7 L5,7 C8,7 10,6 10,4.5 C10,3 8,2 5,2 L-1,2 L-1,-2 L5,-2 C8,-2 9,-3 9,-4.5 C9,-6 7,-7 5,-7 L-4,-7 Z" 
            fill="#FFFFFF" />
      <!-- Center High-Contrast Cutout -->
      <rect x="-2" y="-1" width="3" height="2" fill="#CC2B00" />
    </g>

    <!-- Swiss Flag Accent on Bottom-Left -->
    <g transform="translate(16, 60)">
      <rect x="0" y="0" width="10" height="7" rx="1.5" fill="#D32F2F" />
      <rect x="4" y="1.5" width="2" height="4" fill="#FFFFFF" />
      <rect x="2.5" y="2.5" width="5" height="2" fill="#FFFFFF" />
    </g>

    <!-- Italian Tricolore Accent on Bottom-Right -->
    <g transform="translate(51, 60)">
      <rect x="0" y="0" width="3.3" height="7" rx="1" fill="#009246" />
      <rect x="3.3" y="0" width="3.4" height="7" fill="#FFFFFF" />
      <rect x="6.7" y="0" width="3.3" height="7" rx="1" fill="#CE2B37" />
    </g>
  </g>

  <!-- Right Typography: EuroBrun Racing F1 Team -->
  <g transform="translate(98, 13)">
    <!-- Top Speed Blade Accent in Competition Orange & White -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="85" height="3" rx="1.5" fill="url(#neonOrange)" />
      <rect x="90" y="0" width="30" height="3" rx="1.5" fill="#FFFFFF" opacity="0.8" />
      <rect x="125" y="0" width="15" height="3" rx="1.5" fill="#FF7700" opacity="0.6" />
    </g>

    <!-- Main Wordmark: EuroBrun -->
    <text x="0" y="28" font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" font-size="25" fill="#FFFFFF" font-style="italic" letter-spacing="1">
      Euro<tspan fill="#FF7700">Brun</tspan>
    </text>

    <!-- Sub-Wordmark: RACING F1 TEAM -->
    <text x="0" y="47" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="800" font-size="12" fill="#FFA040" letter-spacing="3.2">
      RACING F1 TEAM
    </text>

    <!-- Subtitle: EURORACING · BRUN MOTORSPORT -->
    <g transform="translate(0, 62)">
      <rect x="0" y="-8" width="3" height="9" rx="1" fill="#FF5500" />
      <text x="8" y="0" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
            font-weight="700" font-size="8.8" fill="#9BA6B3" letter-spacing="2.2">
        EURORACING · BRUN MOTORSPORT
      </text>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Brazilian Green Gradient -->
    <linearGradient id="fitGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C84B" />
      <stop offset="60%" stop-color="#009B3A" />
      <stop offset="100%" stop-color="#006622" />
    </linearGradient>

    <!-- Brazilian Yellow Gradient -->
    <linearGradient id="fitYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF233" />
      <stop offset="60%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#E5A800" />
    </linearGradient>

    <!-- Brazilian Blue Gradient -->
    <linearGradient id="fitBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0038A8" />
      <stop offset="100%" stop-color="#001B5E" />
    </linearGradient>

    <filter id="fitShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left Emblem: The Iconic Fittipaldi Double-F Brazilian Crest -->
  <g transform="translate(14, 11)" filter="url(#fitShadow)">
    <!-- Base Shield -->
    <rect x="0" y="0" width="72" height="73" rx="10" fill="#0A0D0E" stroke="#1C3826" stroke-width="1.5" />
    <rect x="3" y="3" width="66" height="67" rx="8" fill="url(#fitGreen)" />

    <!-- Brazilian Central Yellow Diamond -->
    <polygon points="36,10 63,36 36,63 9,36" fill="url(#fitYellow)" />

    <!-- Central Blue Circle -->
    <circle cx="36" cy="36" r="19" fill="url(#fitBlue)" stroke="#FFFFFF" stroke-width="0.8" />

    <!-- Stylized Double 'FF' Monogram (Fittipaldi F1 Icon) -->
    <g transform="translate(36, 36) scale(0.95)">
      <!-- Left 'F' -->
      <path d="M -9 -11 L 3 -11 L 2 -7 L -5 -7 L -5 -2 L 1 -2 L 0 2 L -5 2 L -6 11 L -10 11 Z" fill="#FFFFFF" />
      <!-- Right 'F' (Interlocking forward) -->
      <path d="M -1 -7 L 11 -7 L 10 -3 L 3 -3 L 3 1 L 9 1 L 8 5 L 3 5 L 2 13 L -2 13 Z" fill="url(#fitYellow)" />
    </g>

    <!-- Star / Laurel Points -->
    <circle cx="16" cy="16" r="1.5" fill="#FFFFFF" />
    <circle cx="56" cy="16" r="1.5" fill="#FFFFFF" />
    <circle cx="16" cy="57" r="1.5" fill="#FFFFFF" />
    <circle cx="56" cy="57" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(100, 20)">
    <!-- Era Badge: FITTIPALDI BROTHERS · BRASIL -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="15" rx="3" fill="#009B3A" fill-opacity="0.25" stroke="#00C84B" stroke-width="0.8" />
      <circle cx="8" cy="7.5" r="2.5" fill="#00C84B" />
      <text x="16" y="11" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#4ADE80" letter-spacing="1.2">EMERSON &amp; WILSON FITTIPALDI</text>
    </g>

    <!-- Main Wordmark: FITTIPALDI AUTOMOTIVE -->
    <g transform="translate(0, 36)">
      <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="24" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="0.5">FITTIPALDI</text>
      <text x="146" y="0" font-family="'Montserrat', sans-serif" font-size="18" font-weight="800" font-style="italic" fill="url(#fitYellow)" letter-spacing="1.2">AUTOMOTIVE</text>
    </g>

    <!-- Subtitle: FORMULA 1 TEAM -->
    <g transform="translate(1, 51)">
      <text x="0" y="0" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#CBD5E1" letter-spacing="3.2">FORMULA 1 TEAM · 1980-1982</text>
    </g>

    <!-- Brazilian Flag Accent Stripes -->
    <line x1="0" y1="58" x2="225" y2="58" stroke="#162E20" stroke-width="1.5" />
    <line x1="0" y1="58" x2="60" y2="58" stroke="#009B3A" stroke-width="2.5" />
    <line x1="63" y1="58" x2="95" y2="58" stroke="#FFD700" stroke-width="2.5" />
    <line x1="98" y1="58" x2="120" y2="58" stroke="#0038A8" stroke-width="2.5" />
  </g>
</svg>
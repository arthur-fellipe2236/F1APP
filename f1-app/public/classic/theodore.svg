<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Theodore Red Gradient -->
    <linearGradient id="theoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2414" />
      <stop offset="60%" stop-color="#D60000" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>

    <!-- Theodore Gold Gradient -->
    <linearGradient id="theoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE07A" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>

    <filter id="theoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left Emblem: Teddy Yip's Theodore Racing Shield Crest -->
  <g transform="translate(14, 10)" filter="url(#theoShadow)">
    <!-- Shield Outer Dark Border -->
    <path d="M 12 3 L 60 3 C 62 3 64 5 64 7 L 64 45 C 64 61 48 71 36 75 C 24 71 8 61 8 45 L 8 7 C 8 5 10 3 12 3 Z" fill="#0A0B0E" stroke="#3D2B14" stroke-width="1.5" />

    <!-- Shield Red Inner Field -->
    <path d="M 13 4 L 59 4 C 61 4 62 5 62 7 L 62 44 C 62 59 47 69 36 73 C 25 69 10 59 10 44 L 10 7 C 10 5 11 4 13 4 Z" fill="url(#theoRed)" />

    <!-- Shield Gold Inner Border Ring -->
    <path d="M 15 6 L 57 6 L 57 43 C 57 56 44 65 36 68 C 28 65 15 56 15 43 Z" fill="none" stroke="url(#theoGold)" stroke-width="1.5" />

    <!-- Top Crown / Star Motif -->
    <g transform="translate(36, 15)">
      <polygon points="0,-6 2,-1 7,-1 3,2 5,7 0,4 -5,7 -3,2 -7,-1 -2,-1" fill="url(#theoGold)" />
    </g>

    <!-- Stylized Theodore 'T' Monogram -->
    <g transform="translate(36, 40)">
      <!-- Top Crossbar of 'T' (Winged chevron) -->
      <polygon points="-20,-16 20,-16 16,-8 -16,-8" fill="#FFFFFF" />
      <polygon points="-18,-15 18,-15 15,-10 -15,-10" fill="url(#theoGold)" />
      <!-- Vertical Stem of 'T' -->
      <polygon points="-5,-8 5,-8 4,16 -4,16" fill="#FFFFFF" />
      <polygon points="-3,-8 3,-8 2,14 -2,14" fill="url(#theoGold)" />
    </g>

    <!-- Base Laurel Stars -->
    <circle cx="24" cy="56" r="1.8" fill="url(#theoGold)" />
    <circle cx="36" cy="61" r="2.2" fill="url(#theoGold)" />
    <circle cx="48" cy="56" r="1.8" fill="url(#theoGold)" />
  </g>

  <!-- Typography -->
  <g transform="translate(100, 20)">
    <!-- Era Badge: TEDDY YIP RACING -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="144" height="15" rx="3" fill="#D4AF37" fill-opacity="0.2" stroke="#D4AF37" stroke-width="0.8" />
      <circle cx="8" cy="7.5" r="2.5" fill="#D4AF37" />
      <text x="16" y="11" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#FFE07A" letter-spacing="1.2">TEDDY YIP · HONG KONG</text>
    </g>

    <!-- Main Wordmark: THEODORE RACING -->
    <g transform="translate(0, 36)">
      <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="25" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="0.5">THEODORE</text>
      <text x="156" y="0" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" font-style="italic" fill="url(#theoGold)" letter-spacing="1.5">RACING</text>
    </g>

    <!-- Subtitle: FORMULA 1 TEAM -->
    <g transform="translate(1, 51)">
      <text x="0" y="0" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#CBD5E1" letter-spacing="3.2">FORMULA 1 TEAM · 1980-1983</text>
    </g>

    <!-- Theodore Red & Gold Accent Stripes -->
    <line x1="0" y1="58" x2="225" y2="58" stroke="#332514" stroke-width="1.5" />
    <line x1="0" y1="58" x2="65" y2="58" stroke="#FF2414" stroke-width="2.5" />
    <line x1="68" y1="58" x2="110" y2="58" stroke="#D4AF37" stroke-width="2.5" />
  </g>
</svg>
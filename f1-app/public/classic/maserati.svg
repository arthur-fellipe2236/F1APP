<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <linearGradient id="maseratiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1832"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>
    <linearGradient id="chromeTrident" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2231A"/>
      <stop offset="100%" stop-color="#A5120B"/>
    </linearGradient>
  </defs>

  <!-- Background Plaque -->
  <rect x="10" y="15" width="480" height="170" rx="26" fill="url(#maseratiBg)" stroke="#1E3260" stroke-width="3"/>
  <rect x="18" y="23" width="464" height="154" rx="20" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Left: Classic Maserati Oval with Neptune Trident -->
  <g transform="translate(45, 30)">
    <!-- Oval Base -->
    <ellipse cx="45" cy="70" rx="42" ry="65" fill="#FFFFFF" stroke="#0A1832" stroke-width="3"/>
    <!-- Bottom Half Navy -->
    <path d="M 3 70 A 42 65 0 0 0 87 70 Z" fill="#0A1832"/>
    
    <!-- Red Trident -->
    <!-- Center Spear -->
    <path d="M 43 15 L 47 15 L 48 95 L 42 95 Z" fill="url(#chromeTrident)"/>
    <polygon points="45,8 39,22 51,22" fill="url(#chromeTrident)"/>
    
    <!-- Left Barb & Curve -->
    <path d="M 28 32 Q 26 62 42 68 L 42 74 Q 20 66 22 28 L 28 32 Z" fill="url(#chromeTrident)"/>
    <polygon points="25,22 19,35 31,35" fill="url(#chromeTrident)"/>
    
    <!-- Right Barb & Curve -->
    <path d="M 62 32 Q 64 62 48 68 L 48 74 Q 70 66 68 28 L 62 32 Z" fill="url(#chromeTrident)"/>
    <polygon points="65,22 59,35 71,35" fill="url(#chromeTrident)"/>
    
    <!-- Base Crossbar -->
    <rect x="36" y="86" width="18" height="5" rx="1.5" fill="url(#chromeTrident)"/>
    
    <!-- Bottom Text inside oval -->
    <text x="45" y="118" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" letter-spacing="1.5" fill="#FFFFFF" text-anchor="middle">MASERATI</text>
  </g>

  <!-- Typography -->
  <text x="315" y="105" font-family="'Times New Roman', 'Baskerville', serif" font-size="54" font-weight="900" letter-spacing="8" fill="#FFFFFF" text-anchor="middle">MASERATI</text>
  <text x="315" y="136" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="6" fill="#E2231A" text-anchor="middle">OFFICINE ALFIERI MASERATI</text>
  <text x="315" y="156" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#88A0D0" text-anchor="middle">WORLD CHAMPIONS 1954 • 1957</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Onyx Deep Indigo Carbon Gradient -->
    <linearGradient id="onyxDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141124" />
      <stop offset="50%" stop-color="#0B0914" />
      <stop offset="100%" stop-color="#040308" />
    </linearGradient>

    <!-- Hot Neon Magenta (Moneytron Signature Pink) -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1493" />
      <stop offset="100%" stop-color="#D6006E" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="electricCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <filter id="onyxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Left Emblem: The Famous Tri-Color Angled Moneytron Onyx Slashes -->
  <g transform="translate(10, 9)" filter="url(#onyxShadow)">
    <!-- Base Plate Shield -->
    <rect x="0" y="0" width="77" height="77" rx="16" fill="url(#onyxDark)" stroke="#FF1493" stroke-width="1.5" />
    
    <!-- Subtle Inner Border -->
    <rect x="4" y="4" width="69" height="69" rx="12" fill="none" stroke="#00E5FF" stroke-width="0.75" stroke-opacity="0.35" />

    <!-- Three Angled Velocity Chevrons/Slashes (Signature Livery of the ORE-1) -->
    <g transform="translate(38.5, 38.5)">
      <!-- Slash 1: Hot Magenta (Left) -->
      <polygon points="-24,18 -12,-18 -4,-18 -16,18" fill="url(#neonPink)" />
      
      <!-- Slash 2: Electric Cyan (Center) -->
      <polygon points="-11,18 1,-18 9,-18 -3,18" fill="url(#electricCyan)" />
      
      <!-- Slash 3: Pure White (Right) -->
      <polygon points="2,18 14,-18 22,-18 10,18" fill="#FFFFFF" />

      <!-- High-Tech Horizontal Grid / Laser Speed Wire -->
      <line x1="-28" y1="0" x2="26" y2="0" stroke="#00E5FF" stroke-width="1" opacity="0.6" stroke-dasharray="2,2" />
    </g>

    <!-- Small Star at Base -->
    <polygon points="38.5,67 40,70 43,70 40.5,71.5 41.5,74.5 38.5,73 35.5,74.5 36.5,71.5 34,70 37,70" fill="#00E5FF" />
  </g>

  <!-- Right Typography: MONEYTRON ONYX GRAND PRIX -->
  <g transform="translate(98, 13)">
    <!-- Top Speed Blade Accent in Magenta & Cyan -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="60" height="3" rx="1.5" fill="url(#neonPink)" />
      <rect x="65" y="0" width="45" height="3" rx="1.5" fill="url(#electricCyan)" />
      <rect x="115" y="0" width="25" height="3" rx="1.5" fill="#FFFFFF" opacity="0.8" />
    </g>

    <!-- Sub-Wordmark: MONEYTRON (Financial High-Tech Sponsor) -->
    <text x="0" y="19" font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-weight="800" font-size="11" fill="url(#electricCyan)" letter-spacing="3.5">
      MONEYTRON
    </text>

    <!-- Main Wordmark: ONYX -->
    <text x="0" y="46" font-family="'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" font-size="28" fill="#FFFFFF" font-style="italic" letter-spacing="2">
      ONYX
    </text>

    <!-- Subtitle: GRAND PRIX FORMULA 1 TEAM -->
    <g transform="translate(0, 62)">
      <rect x="0" y="-8.5" width="3" height="9.5" rx="1" fill="#FF1493" />
      <text x="8" y="0" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
            font-weight="700" font-size="9.5" fill="#FF80BF" letter-spacing="2.8">
        GRAND PRIX FORMULA 1
      </text>
    </g>
  </g>
</svg>
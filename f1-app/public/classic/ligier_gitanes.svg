<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- French Racing Blue Gradient -->
    <linearGradient id="ligBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055FF" />
      <stop offset="60%" stop-color="#0038A8" />
      <stop offset="100%" stop-color="#001F6B" />
    </linearGradient>

    <!-- Gitanes Gold Gradient -->
    <linearGradient id="gitGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <filter id="ligShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left Emblem: The Gitanes Gypsy Silhouette & Ligier Shield -->
  <g transform="translate(14, 11)" filter="url(#ligShadow)">
    <!-- Base Shield -->
    <rect x="0" y="0" width="72" height="73" rx="10" fill="#090B10" stroke="#1D2A47" stroke-width="1.5" />
    <rect x="3" y="3" width="66" height="67" rx="8" fill="url(#ligBlue)" />

    <!-- Gitanes Gypsy Dancer Silhouette in Stark White & Midnight Silhouette -->
    <!-- Tambourine / Fan raised above head -->
    <circle cx="48" cy="18" r="4" fill="#FFFFFF" />

    <!-- Dancer Head & Flowing Hair -->
    <circle cx="37" cy="22" r="4.5" fill="#FFFFFF" />
    <path d="M 33 22 C 30 20 28 25 26 28 C 30 27 34 26 35 25 Z" fill="#FFFFFF" />

    <!-- Graceful Arms and Torso -->
    <path d="M 36 26 C 41 24 45 20 48 18 L 47 21 C 44 24 39 28 36 30 Z" fill="#FFFFFF" />
    <path d="M 34 26 C 30 27 26 30 24 35 L 26 36 C 28 32 32 29 35 28 Z" fill="#FFFFFF" />
    <path d="M 35 27 C 33 33 34 39 33 44 C 36 44 38 39 37 33 C 37 30 36 28 35 27 Z" fill="#FFFFFF" />

    <!-- Billowing Flamenco / Gypsy Skirt Waves -->
    <path d="
      M 33 44 
      C 27 48 18 52 14 62 
      C 24 64 36 63 46 62 
      C 56 61 60 55 58 50 
      C 52 46 44 45 37 44 Z
    " fill="#FFFFFF" />

    <!-- Skirt Shadow Folds -->
    <path d="M 22 55 C 28 54 36 53 44 54 C 40 57 32 59 22 60 Z" fill="#0038A8" opacity="0.4" />
    <path d="M 32 46 C 36 50 42 51 50 49 C 48 52 42 54 34 52 Z" fill="#0038A8" opacity="0.3" />

    <!-- Classic 'JS' Monogram honoring Jo Schlesser -->
    <g transform="translate(10, 16)">
      <text x="0" y="0" font-family="'Brush Script MT', 'Palatino', serif" font-size="12" font-style="italic" font-weight="bold" fill="url(#gitGold)">JS</text>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 20)">
    <!-- Era Badge: ÉQUIPE LIGIER GITANES -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="154" height="15" rx="3" fill="#0038A8" fill-opacity="0.3" stroke="#0055FF" stroke-width="0.8" />
      <circle cx="8" cy="7.5" r="2.5" fill="#0055FF" />
      <text x="16" y="11" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#66A3FF" letter-spacing="1.2">ÉQUIPE LIGIER GITANES</text>
    </g>

    <!-- Main Wordmark: LIGIER GITANES -->
    <g transform="translate(0, 36)">
      <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="26" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="0.5">LIGIER</text>
      <text x="100" y="0" font-family="'Montserrat', sans-serif" font-size="22" font-weight="800" font-style="italic" fill="url(#gitGold)" letter-spacing="1.5">GITANES</text>
    </g>

    <!-- Subtitle: FORMULA 1 TEAM -->
    <g transform="translate(1, 51)">
      <text x="0" y="0" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#CBD5E1" letter-spacing="3.2">FORMULA 1 TEAM · 1980-1984</text>
    </g>

    <!-- French Flag Accent Bar -->
    <line x1="0" y1="58" x2="225" y2="58" stroke="#1E283D" stroke-width="1.5" />
    <line x1="0" y1="58" x2="40" y2="58" stroke="#0055FF" stroke-width="2.5" />
    <line x1="42" y1="58" x2="62" y2="58" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="64" y1="58" x2="84" y2="58" stroke="#E10600" stroke-width="2.5" />
  </g>
</svg>
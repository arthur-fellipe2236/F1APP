<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 95" width="100%" height="100%">
  <defs>
    <!-- Stealth Dark Gradient -->
    <linearGradient id="shdDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F232B" />
      <stop offset="60%" stop-color="#0E1015" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Shadow Red Gradient -->
    <linearGradient id="shdRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2414" />
      <stop offset="100%" stop-color="#BD0000" />
    </linearGradient>

    <filter id="shdShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left Emblem: Don Nichols' Legendary Cloaked Spy Silhouette -->
  <g transform="translate(14, 11)" filter="url(#shdShadow)">
    <!-- Base Shield -->
    <rect x="0" y="0" width="72" height="73" rx="10" fill="#050608" stroke="#252A36" stroke-width="1.5" />
    <rect x="3" y="3" width="66" height="67" rx="8" fill="url(#shdDark)" />

    <!-- Red Inner Accent Ring -->
    <rect x="5" y="5" width="62" height="63" rx="6" fill="none" stroke="url(#shdRed)" stroke-width="1.2" opacity="0.8" />

    <!-- Cloaked Figure (The Shadow) in High-Contrast White Silhouette -->
    <!-- Fedora Hat Crown -->
    <path d="M 24 23 C 26 15 46 15 48 23 Z" fill="#FFFFFF" />
    <!-- Hat Crease Inset -->
    <path d="M 32 17 C 36 19 40 17 40 17" stroke="#0E1015" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <!-- Fedora Wide Brim -->
    <ellipse cx="36" cy="23" rx="20" ry="3.5" fill="#FFFFFF" />
    <!-- Hat Ribbon Band -->
    <path d="M 25 21 L 47 21 L 47 23 L 25 23 Z" fill="url(#shdRed)" />

    <!-- High Turned-Up Trench Coat Collar (Classic Mystery Look) -->
    <!-- Left Collar Wing -->
    <polygon points="17,37 25,25 31,34 23,45" fill="#FFFFFF" />
    <!-- Right Collar Wing -->
    <polygon points="55,37 47,25 41,34 49,45" fill="#FFFFFF" />
    <!-- Center Coat Lapel / Trench Button Line -->
    <polygon points="31,34 41,34 38,58 34,58" fill="#FFFFFF" />
    <!-- Coat Shoulders & Torso -->
    <path d="M 17 37 C 14 44 12 56 12 63 L 60 63 C 60 56 58 44 55 37 L 49 45 L 36 50 L 23 45 Z" fill="#FFFFFF" />

    <!-- Shadow Mystery Slit Eyes glowing beneath fedora brim -->
    <line x1="28" y1="27" x2="33" y2="28" stroke="#0E1015" stroke-width="1.5" stroke-linecap="round" />
    <line x1="39" y1="28" x2="44" y2="27" stroke="#0E1015" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(100, 20)">
    <!-- Era Badge: DON NICHOLS · FORMULA 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="15" rx="3" fill="#FF2414" fill-opacity="0.2" stroke="#FF2414" stroke-width="0.8" />
      <circle cx="8" cy="7.5" r="2.5" fill="#FF2414" />
      <text x="16" y="11" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900" fill="#FF6B5C" letter-spacing="1.2">DON NICHOLS · USA</text>
    </g>

    <!-- Main Wordmark: SHADOW RACING CARS -->
    <g transform="translate(0, 36)">
      <text x="0" y="0" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="28" font-weight="900" font-style="italic" fill="#FFFFFF" letter-spacing="1">SHADOW</text>
      <!-- Small 'RACING CARS' badge -->
      <g transform="translate(150, -18)">
        <rect x="0" y="0" width="76" height="18" rx="3" fill="#0E1015" stroke="#FF2414" stroke-width="0.8" />
        <text x="38" y="13" font-family="'Titillium Web', sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">RACING CARS</text>
      </g>
    </g>

    <!-- Subtitle: FORMULA 1 TEAM -->
    <g transform="translate(1, 51)">
      <text x="0" y="0" font-family="'Titillium Web', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#CBD5E1" letter-spacing="3.2">FORMULA 1 TEAM · 1980</text>
    </g>

    <!-- Stealth Racing Accent Stripes -->
    <line x1="0" y1="58" x2="225" y2="58" stroke="#252A36" stroke-width="1.5" />
    <line x1="0" y1="58" x2="70" y2="58" stroke="#FF2414" stroke-width="2.5" />
    <line x1="73" y1="58" x2="115" y2="58" stroke="#FFFFFF" stroke-width="2.5" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <linearGradient id="vanwallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003515"/>
      <stop offset="100%" stop-color="#001808"/>
    </linearGradient>
    <linearGradient id="vanwallGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#FFF0A0"/>
      <stop offset="100%" stop-color="#AA8820"/>
    </linearGradient>
  </defs>

  <!-- Background Plaque -->
  <rect x="10" y="15" width="480" height="170" rx="26" fill="url(#vanwallBg)" stroke="url(#vanwallGold)" stroke-width="3.5"/>
  <rect x="18" y="23" width="464" height="154" rx="20" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Left: Vanwall Winged W Shield -->
  <g transform="translate(30, 32)">
    <!-- Teardrop / Shield -->
    <path d="M 50 10 L 92 25 L 86 100 Q 50 135 50 135 Q 50 135 14 100 L 8 25 Z" fill="#00240E" stroke="url(#vanwallGold)" stroke-width="3"/>
    
    <!-- Stylized Winged W Motif -->
    <path d="M 22 45 L 34 95 L 50 60 L 66 95 L 78 45 L 68 45 L 59 78 L 50 52 L 41 78 L 32 45 Z" fill="url(#vanwallGold)"/>
    
    <!-- Top Laurel Accent -->
    <circle cx="50" cy="30" r="6" fill="#D4AF37"/>
  </g>

  <!-- Typography -->
  <text x="305" y="108" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" font-style="italic" letter-spacing="6" fill="#FFFFFF" text-anchor="middle" stroke="#000000" stroke-width="2">VANWALL</text>
  <text x="305" y="140" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="6" fill="url(#vanwallGold)" text-anchor="middle">VANDERVELL PRODUCTS</text>
  <text x="305" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#88C498" text-anchor="middle">FIRST F1 CONSTRUCTORS' CHAMPION • 1958</text>
</svg>
